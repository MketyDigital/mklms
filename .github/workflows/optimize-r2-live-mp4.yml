name: Optimize existing R2 live-class MP4 (manual, non-destructive)

on:
  workflow_dispatch:
    inputs:
      source_key:
        description: "Existing private R2 media/...mp4 object key (not a URL)"
        required: true
        type: string
      quality:
        description: "H.264 quality (18 highest, 20 balanced, 22 smaller)"
        required: true
        default: "20"
        type: choice
        options:
          - "18"
          - "20"
          - "22"

permissions:
  contents: read

concurrency:
  group: r2-live-mp4-optimizer
  cancel-in-progress: false

jobs:
  optimize:
    name: Encode and upload a separate MP4 copy
    runs-on: ubuntu-latest
    timeout-minutes: 350
    # No actions on R2 or other external services until manually dispatched.
    env:
      SOURCE_KEY: ${{ inputs.source_key }}
      CRF: ${{ inputs.quality }}
      R2_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.MKLMS_R2_DIRECT_UPLOAD_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.MKLMS_R2_DIRECT_UPLOAD_SECRET_ACCESS_KEY }}
      R2_BUCKET: spf-media

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure FFmpeg and AWS CLI are available
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null 2>&1 || ! command -v ffprobe >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi

          # Ubuntu 24.04 runners may not publish an apt awscli package.
          # Prefer the runner's existing AWS CLI; otherwise install official AWS CLI v2.
          if ! command -v aws >/dev/null 2>&1; then
            command -v curl >/dev/null 2>&1
            command -v unzip >/dev/null 2>&1
            curl --fail --silent --show-error --location \
              https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip \
              --output "${RUNNER_TEMP}/awscliv2.zip"
            unzip -q "${RUNNER_TEMP}/awscliv2.zip" -d "${RUNNER_TEMP}/awscli-install"
            sudo "${RUNNER_TEMP}/awscli-install/aws/install"
          fi

          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1
          aws --version

      - name: Fail if credentials are not configured
        shell: bash
        run: |
          : "${R2_ACCOUNT_ID:?Configure existing CLOUDFLARE_ACCOUNT_ID as repository secret}"
          : "${R2_ACCESS_KEY_ID:?Missing repository secret MKLMS_R2_DIRECT_UPLOAD_ACCESS_KEY_ID}"
          : "${R2_SECRET_ACCESS_KEY:?Missing repository secret MKLMS_R2_DIRECT_UPLOAD_SECRET_ACCESS_KEY}"

      - name: Optimize selected private MP4 to new R2 object
        shell: bash
        env:
          # A unique output key per run/attempt. The input can never be overwritten.
          OUTPUT_KEY: media/optimized/${{ github.run_id }}/${{ github.run_attempt }}/optimized.mp4
        run: bash scripts/optimize-r2-live-mp4.sh "$SOURCE_KEY" "$CRF" "$OUTPUT_KEY"
