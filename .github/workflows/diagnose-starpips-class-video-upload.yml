name: Diagnose Starpips class-video upload

on:
  push:
    branches:
      - fix/starpips-class-video-r2-upload-2026-10-07

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      R2_DIRECT_UPLOAD_ACCESS_KEY_ID: ${{ secrets.R2_DIRECT_UPLOAD_ACCESS_KEY_ID }}
      R2_DIRECT_UPLOAD_SECRET_ACCESS_KEY: ${{ secrets.R2_DIRECT_UPLOAD_SECRET_ACCESS_KEY }}
      APP_WORKER: mklms
      R2_BUCKET: spf-media
    steps:
      - name: Checkout diagnostic branch
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Verify Cloudflare credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_API_TOKEN"

      - name: Inspect live Worker binding names only
        shell: bash
        run: |
          set -euo pipefail
          curl --silent --show-error --fail-with-body             "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$APP_WORKER/settings"             -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" >/tmp/settings.json
          jq -e '.success == true' /tmp/settings.json >/dev/null
          echo "Live mklms binding names/types:"
          jq -r '.result.bindings[]? | [.name,.type] | @tsv' /tmp/settings.json | sort
          rm -f /tmp/settings.json

      - name: Inspect live R2 CORS
        shell: bash
        run: |
          set -euo pipefail
          status=$(curl --silent --show-error --output /tmp/cors.json --write-out '%{http_code}'             "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/r2/buckets/$R2_BUCKET/cors"             -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN")
          echo "R2 CORS HTTP status: $status"
          if [ "$status" = "200" ]; then
            jq -e '.success == true' /tmp/cors.json >/dev/null
            jq '.result' /tmp/cors.json
          else
            jq -r '.errors[]?.message // empty' /tmp/cors.json
          fi
          rm -f /tmp/cors.json

      - name: Smoke exact presigned PUT when repository deployment credentials are available
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$R2_DIRECT_UPLOAD_ACCESS_KEY_ID" ] || [ -z "$R2_DIRECT_UPLOAD_SECRET_ACCESS_KEY" ]; then
            echo "Repository deployment direct-upload credentials are not available to this workflow; skipping credential smoke."
            exit 0
          fi
          npm install --no-audit --no-fund >/dev/null
          export MKLMS_R2_DIRECT_UPLOAD_BUCKET="$R2_BUCKET"
          export MKLMS_R2_DIRECT_UPLOAD_ENDPOINT="https://$CLOUDFLARE_ACCOUNT_ID.r2.cloudflarestorage.com"
          export MKLMS_R2_DIRECT_UPLOAD_ACCESS_KEY_ID="$R2_DIRECT_UPLOAD_ACCESS_KEY_ID"
          export MKLMS_R2_DIRECT_UPLOAD_SECRET_ACCESS_KEY="$R2_DIRECT_UPLOAD_SECRET_ACCESS_KEY"
          node --experimental-strip-types --input-type=module <<'NODE' >/tmp/auth.json
          import { createDirectR2UploadAuthorization } from './src/features/media/server/r2-direct-upload.ts';
          const auth = await createDirectR2UploadAuthorization({ contentType: 'video/mp4', sizeBytes: 12 });
          console.log(JSON.stringify({ uploadUrl: auth.uploadUrl, objectKey: auth.objectKey }));
          NODE
          upload_url=$(jq -r '.uploadUrl' /tmp/auth.json)
          object_key=$(jq -r '.objectKey' /tmp/auth.json)
          printf 'diagnostic12' >/tmp/tiny.mp4
          http=$(curl --silent --show-error --output /tmp/put-response --write-out '%{http_code}'             -X PUT "$upload_url" -H 'Content-Type: video/mp4' --data-binary @/tmp/tiny.mp4)
          echo "Presigned PUT HTTP status: $http"
          test "$http" = "200"
          node --experimental-strip-types --input-type=module "$object_key" <<'NODE'
          import { verifyDirectR2Object } from './src/features/media/server/r2-direct-upload.ts';
          const result = await verifyDirectR2Object(process.argv[2]);
          if (!result.exists || result.contentLength !== 12 || result.contentType !== 'video/mp4') throw new Error('Unexpected verification result.');
          console.log('Presigned PUT + HEAD verification succeeded.');
          NODE
          node --input-type=module "$object_key" <<'NODE'
          import { S3Client, DeleteObjectCommand } from '@aws-sdk/client-s3';
          const objectKey = process.argv[2];
          const client = new S3Client({
            region: 'auto',
            endpoint: process.env.MKLMS_R2_DIRECT_UPLOAD_ENDPOINT,
            forcePathStyle: true,
            credentials: {
              accessKeyId: process.env.MKLMS_R2_DIRECT_UPLOAD_ACCESS_KEY_ID,
              secretAccessKey: process.env.MKLMS_R2_DIRECT_UPLOAD_SECRET_ACCESS_KEY,
            },
          });
          await client.send(new DeleteObjectCommand({ Bucket: process.env.MKLMS_R2_DIRECT_UPLOAD_BUCKET, Key: objectKey }));
          console.log('Diagnostic object deleted.');
          NODE
          rm -f /tmp/auth.json /tmp/tiny.mp4 /tmp/put-response
