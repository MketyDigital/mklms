name: Verify GitHub Free private readiness

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      MKLMS_DATABASE_URL: ${{ secrets.MKLMS_DATABASE_URL }}
      MKLMS_DATABASE_SSL: ${{ secrets.MKLMS_DATABASE_SSL }}
      MKETY_DB_HOST: ${{ secrets.MKETY_DB_HOST }}
      MKETY_DB_PORT: ${{ secrets.MKETY_DB_PORT }}
      MKETY_DB_NAME: ${{ secrets.MKETY_DB_NAME }}
      MKETY_DB_USER: ${{ secrets.MKETY_DB_USER }}
      MKETY_DB_PASSWORD: ${{ secrets.MKETY_DB_PASSWORD }}
      MKETY_ADMIN_ACCESS_KEY: ${{ secrets.MKETY_ADMIN_ACCESS_KEY }}
      MKETY_ADMIN_SESSION_SECRET: ${{ secrets.MKETY_ADMIN_SESSION_SECRET }}
      MKETY_MEDIA_SIGNING_SECRET: ${{ secrets.MKETY_MEDIA_SIGNING_SECRET }}
      MKETY_MANAGED_HOSTING_OPERATOR_KEY: ${{ secrets.MKETY_MANAGED_HOSTING_OPERATOR_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify required repository-level secrets are present
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for name in \
            CLOUDFLARE_ACCOUNT_ID \
            CLOUDFLARE_API_TOKEN \
            MKLMS_DATABASE_URL \
            MKLMS_DATABASE_SSL \
            MKETY_DB_HOST \
            MKETY_DB_PORT \
            MKETY_DB_NAME \
            MKETY_DB_USER \
            MKETY_DB_PASSWORD \
            MKETY_ADMIN_ACCESS_KEY \
            MKETY_ADMIN_SESSION_SECRET \
            MKETY_MEDIA_SIGNING_SECRET \
            MKETY_MANAGED_HOSTING_OPERATOR_KEY
          do
            if [ -z "${!name:-}" ]; then
              echo "MISSING repository secret: $name"
              missing=1
            else
              echo "OK repository secret present: $name"
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Repository is not ready to rely only on GitHub Free private-compatible secrets."
            exit 1
          fi

      - name: Verify workflows do not depend on Starpips environment secrets
        shell: bash
        run: |
          set -euo pipefail
          ! grep -nE '^\s*environment:\s*(database-migrations|starpips)\s*$' .github/workflows/release-starpips-production.yml
          ! grep -nE '^\s*environment:\s*database-migrations\s*$' .github/workflows/run-db-migrations.yml
          grep -q 'secrets.MKLMS_DATABASE_URL' .github/workflows/release-starpips-production.yml
          grep -q 'secrets.MKLMS_DATABASE_URL' .github/workflows/run-db-migrations.yml

      - name: Verify installation wrappers still own deployment secret mapping
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'secrets.MKETY_DB_PASSWORD' .github/workflows/mkety-academy-release.yml
          for name in MKETY_DB_HOST MKETY_DB_PORT MKETY_DB_NAME MKETY_DB_USER; do
            grep -q "secrets.\$name" .github/workflows/deploy-mkety-installation.yml
            grep -q "secrets.\$name" .github/workflows/provision-mkety-installation.yml
          done
          grep -q 'secrets.MKETY_ADMIN_ACCESS_KEY' .github/workflows/mkety-academy-release.yml
          grep -q 'secrets.MKETY_MANAGED_HOSTING_OPERATOR_KEY' .github/workflows/mkety-academy-release.yml
          grep -q 'workflow_call:' .github/workflows/deploy-installation-preview.yml
          grep -q 'workflow_call:' .github/workflows/deploy-installation-production.yml
          grep -q 'workflow_call:' .github/workflows/provision-installation.yml

      - name: Report repository-secret readiness
        run: |
          echo "GitHub Free private repository-secret checks passed."
          echo "No secret values were printed."
