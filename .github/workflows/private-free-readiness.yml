name: Verify GitHub Free private readiness

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      STARPIPS_DATABASE_URL: ${{ secrets.STARPIPS_DATABASE_URL }}
      STARPIPS_DATABASE_SSL: ${{ secrets.STARPIPS_DATABASE_SSL }}
      MKETY_ADMIN_ACCESS_KEY: ${{ secrets.MKETY_ADMIN_ACCESS_KEY }}
      MKETY_ADMIN_SESSION_SECRET: ${{ secrets.MKETY_ADMIN_SESSION_SECRET }}
      MKETY_MEDIA_SIGNING_SECRET: ${{ secrets.MKETY_MEDIA_SIGNING_SECRET }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify required repository-level secrets are present
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for name in \
            CLOUDFLARE_ACCOUNT_ID \
            CLOUDFLARE_API_TOKEN \
            STARPIPS_DATABASE_URL \
            STARPIPS_DATABASE_SSL \
            MKETY_ADMIN_ACCESS_KEY \
            MKETY_ADMIN_SESSION_SECRET \
            MKETY_MEDIA_SIGNING_SECRET
          do
            if [ -z "${!name:-}" ]; then
              echo "MISSING repository secret: $name"
              missing=1
            else
              echo "OK repository secret present: $name"
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Repository is not ready to rely only on GitHub Free private-compatible secrets."
            exit 1
          fi

      - name: Verify workflows do not depend on Starpips environment secrets
        shell: bash
        run: |
          set -euo pipefail
          ! grep -nE '^\s*environment:\s*(database-migrations|starpips)\s*$' .github/workflows/release-starpips-production.yml
          ! grep -nE '^\s*environment:\s*database-migrations\s*$' .github/workflows/run-db-migrations.yml
          grep -q 'secrets.STARPIPS_DATABASE_URL' .github/workflows/release-starpips-production.yml
          grep -q 'secrets.STARPIPS_DATABASE_URL' .github/workflows/run-db-migrations.yml

      - name: Verify installation wrappers still own deployment secret mapping
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'secrets.MKETY_ADMIN_ACCESS_KEY' .github/workflows/mkety-academy-release.yml
          grep -q 'workflow_call:' .github/workflows/deploy-installation-preview.yml
          grep -q 'workflow_call:' .github/workflows/deploy-installation-production.yml
          grep -q 'workflow_call:' .github/workflows/provision-installation.yml

      - name: Report readiness
        run: |
          echo "GitHub Free private readiness checks passed."
          echo "No secret values were printed."
