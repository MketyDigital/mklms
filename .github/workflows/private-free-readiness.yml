name: Verify GitHub Free private readiness

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      STARPIPS_DATABASE_URL: ${{ secrets.STARPIPS_DATABASE_URL }}
      STARPIPS_DATABASE_SSL: ${{ secrets.STARPIPS_DATABASE_SSL }}
      MKETY_DB_PASSWORD: ${{ secrets.MKETY_DB_PASSWORD }}
      MKETY_ADMIN_ACCESS_KEY: ${{ secrets.MKETY_ADMIN_ACCESS_KEY }}
      MKETY_ADMIN_SESSION_SECRET: ${{ secrets.MKETY_ADMIN_SESSION_SECRET }}
      MKETY_MEDIA_SIGNING_SECRET: ${{ secrets.MKETY_MEDIA_SIGNING_SECRET }}
      MKETY_MANAGED_HOSTING_OPERATOR_KEY: ${{ secrets.MKETY_MANAGED_HOSTING_OPERATOR_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify required repository-level secrets are present
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for name in \
            CLOUDFLARE_ACCOUNT_ID \
            CLOUDFLARE_API_TOKEN \
            STARPIPS_DATABASE_URL \
            STARPIPS_DATABASE_SSL \
            MKETY_DB_PASSWORD \
            MKETY_ADMIN_ACCESS_KEY \
            MKETY_ADMIN_SESSION_SECRET \
            MKETY_MEDIA_SIGNING_SECRET \
            MKETY_MANAGED_HOSTING_OPERATOR_KEY
          do
            if [ -z "${!name:-}" ]; then
              echo "MISSING repository secret: $name"
              missing=1
            else
              echo "OK repository secret present: $name"
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Repository is not ready to rely only on GitHub Free private-compatible secrets."
            exit 1
          fi

      - name: Verify workflows do not depend on Starpips environment secrets
        shell: bash
        run: |
          set -euo pipefail
          ! grep -nE '^\s*environment:\s*(database-migrations|starpips)\s*$' .github/workflows/release-starpips-production.yml
          ! grep -nE '^\s*environment:\s*database-migrations\s*$' .github/workflows/run-db-migrations.yml
          grep -q 'secrets.STARPIPS_DATABASE_URL' .github/workflows/release-starpips-production.yml
          grep -q 'secrets.STARPIPS_DATABASE_URL' .github/workflows/run-db-migrations.yml

      - name: Verify installation wrappers still own deployment secret mapping
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'secrets.MKETY_DB_PASSWORD' .github/workflows/mkety-academy-release.yml
          grep -q 'secrets.MKETY_ADMIN_ACCESS_KEY' .github/workflows/mkety-academy-release.yml
          grep -q 'secrets.MKETY_MANAGED_HOSTING_OPERATOR_KEY' .github/workflows/mkety-academy-release.yml
          grep -q 'workflow_call:' .github/workflows/deploy-installation-preview.yml
          grep -q 'workflow_call:' .github/workflows/deploy-installation-production.yml
          grep -q 'workflow_call:' .github/workflows/provision-installation.yml

      - name: Report repository-secret readiness
        run: |
          echo "GitHub Free private repository-secret checks passed."
          echo "No secret values were printed."

  verify_starpips_secret_parity:
    name: Verify Starpips copied-secret parity while public
    if: ${{ github.event.repository.private == false }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: database-migrations
    env:
      OLD_DATABASE_URL: ${{ secrets.MKLMS_DATABASE_URL }}
      OLD_DATABASE_SSL: ${{ secrets.MKLMS_DATABASE_SSL }}
      NEW_DATABASE_URL: ${{ secrets.STARPIPS_DATABASE_URL }}
      NEW_DATABASE_SSL: ${{ secrets.STARPIPS_DATABASE_SSL }}
    steps:
      - name: Compare old environment secrets with new repository secrets without printing values
        shell: bash
        run: |
          set -euo pipefail
          test -n "${OLD_DATABASE_URL:-}" || { echo "Old database-migrations MKLMS_DATABASE_URL is missing"; exit 1; }
          test -n "${NEW_DATABASE_URL:-}" || { echo "New repository STARPIPS_DATABASE_URL is missing"; exit 1; }
          test -n "${OLD_DATABASE_SSL:-}" || { echo "Old database-migrations MKLMS_DATABASE_SSL is missing"; exit 1; }
          test -n "${NEW_DATABASE_SSL:-}" || { echo "New repository STARPIPS_DATABASE_SSL is missing"; exit 1; }
          test "$OLD_DATABASE_URL" = "$NEW_DATABASE_URL" || { echo "Starpips database URL copy does not match the existing environment secret"; exit 1; }
          test "$OLD_DATABASE_SSL" = "$NEW_DATABASE_SSL" || { echo "Starpips database SSL copy does not match the existing environment secret"; exit 1; }
          echo "Starpips repository database secrets exactly match the existing public-repository environment secrets."
