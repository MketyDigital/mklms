name: Inspect Starpips live-video timing (read-only)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      DATABASE_URL: ${{ secrets.STARPIPS_DATABASE_URL }}
      DATABASE_SSL: ${{ secrets.STARPIPS_DATABASE_SSL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install isolated read-only database client
        run: npm install --prefix /tmp/timing-inspection-deps --no-save --package-lock=false --ignore-scripts pg
      - name: Inspect live class media links and saved timeline bounds
        shell: bash
        run: |
          set -euo pipefail
          test -n "$DATABASE_URL" || { echo "Missing STARPIPS_DATABASE_URL"; exit 1; }
          node --input-type=module <<'NODE'
          import { createRequire } from "node:module";
          const require = createRequire("/tmp/timing-inspection-deps/package.json");
          const { Pool } = require("pg");
          const pool = new Pool({
            connectionString: process.env.DATABASE_URL,
            ssl: process.env.DATABASE_SSL === "disable" ? false : { rejectUnauthorized: false },
            max: 1,
          });
          const client = await pool.connect();
          try {
            await client.query("BEGIN READ ONLY");
            const sessions = await client.query(`
              SELECT b.title AS batch_title, b.slug AS batch_slug,
                     s.id AS session_id, s.title AS session_title,
                     s.starts_at, s.duration_seconds AS session_duration_seconds,
                     m.id AS media_id, m.title AS media_title, m.provider,
                     m.source_type, m.provider_asset_id,
                     m.duration_seconds AS media_duration_seconds,
                     m.created_at AS media_created_at,
                     COALESCE(t.message_count, 0)::int AS timeline_message_count,
                     t.first_offset_seconds, t.last_offset_seconds
                FROM live_sessions s
                JOIN live_batches b ON b.id = s.batch_id
                LEFT JOIN media_assets m ON m.id = s.media_asset_id
                LEFT JOIN LATERAL (
                  SELECT COUNT(*) AS message_count, MIN(offset_seconds) AS first_offset_seconds,
                         MAX(offset_seconds) AS last_offset_seconds
                    FROM live_timeline_messages WHERE session_id = s.id
                ) t ON TRUE
               ORDER BY m.created_at DESC NULLS LAST, s.starts_at DESC
            `);
            const recentAssets = await client.query(`
              SELECT id AS media_id, title AS media_title, provider, source_type,
                     provider_asset_id, duration_seconds, created_at
                FROM media_assets
               WHERE created_at >= NOW() - INTERVAL '45 days'
               ORDER BY created_at DESC
               LIMIT 100
            `);
            await client.query("COMMIT");
            const isoRows = (rows) => rows.map((row) => Object.fromEntries(
              Object.entries(row).map(([key, value]) => [key, value instanceof Date ? value.toISOString() : value]),
            ));
            console.log("Live sessions and linked media; timeline text is intentionally excluded:");
            console.log(JSON.stringify(isoRows(sessions.rows), null, 2));
            console.log("Recent media assets, including unlinked originals if retained:");
            console.log(JSON.stringify(isoRows(recentAssets.rows), null, 2));
          } catch (error) {
            await client.query("ROLLBACK");
            throw error;
          } finally {
            client.release();
            await pool.end();
          }
          NODE