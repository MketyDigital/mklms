name: Mkety Academy release

on:
  push:
    branches:
      - preview/mkety-academy
      - production/mkety-academy

permissions:
  contents: read

jobs:
  preview:
    if: github.ref_name == 'preview/mkety-academy'
    uses: ./.github/workflows/deploy-installation-preview.yml
    with:
      installation_id: mkety-academy
    secrets:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      MKLMS_ADMIN_ACCESS_KEY: ${{ secrets.MKETY_ADMIN_ACCESS_KEY }}
      MKLMS_ADMIN_SESSION_SECRET: ${{ secrets.MKETY_ADMIN_SESSION_SECRET }}
      MKLMS_MEDIA_SIGNING_SECRET: ${{ secrets.MKETY_MEDIA_SIGNING_SECRET }}
      MKLMS_BILLING_SERVICE_URL: ${{ secrets.MKETY_BILLING_SERVICE_URL }}
      MKLMS_BILLING_SHARED_SECRET: ${{ secrets.MKETY_BILLING_SHARED_SECRET }}
      R2_DIRECT_UPLOAD_ACCESS_KEY_ID: ${{ secrets.MKETY_R2_DIRECT_UPLOAD_ACCESS_KEY_ID }}
      R2_DIRECT_UPLOAD_SECRET_ACCESS_KEY: ${{ secrets.MKETY_R2_DIRECT_UPLOAD_SECRET_ACCESS_KEY }}

  # Mkety Academy's isolated database schema is pre-migrated and audited through Supabase
  # before the production pointer is moved. GitHub-hosted runners do not mutate this
  # database because the direct endpoint is IPv6-only and shared-pooler routing for the
  # isolated custom role is not a reliable release dependency.
  production:
    if: github.ref_name == 'production/mkety-academy'
    uses: ./.github/workflows/deploy-installation-production.yml
    with:
      installation_id: mkety-academy
      release_sha: ${{ github.sha }}
    secrets:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      MKLMS_ADMIN_ACCESS_KEY: ${{ secrets.MKETY_ADMIN_ACCESS_KEY }}
      MKLMS_ADMIN_SESSION_SECRET: ${{ secrets.MKETY_ADMIN_SESSION_SECRET }}
      MKLMS_MEDIA_SIGNING_SECRET: ${{ secrets.MKETY_MEDIA_SIGNING_SECRET }}
      MKLMS_BILLING_SERVICE_URL: ${{ secrets.MKETY_BILLING_SERVICE_URL }}
      MKLMS_BILLING_SHARED_SECRET: ${{ secrets.MKETY_BILLING_SHARED_SECRET }}
      MKLMS_MANAGED_HOSTING_OPERATOR_KEY: ${{ secrets.MKETY_MANAGED_HOSTING_OPERATOR_KEY }}
      R2_DIRECT_UPLOAD_ACCESS_KEY_ID: ${{ secrets.MKETY_R2_DIRECT_UPLOAD_ACCESS_KEY_ID }}
      R2_DIRECT_UPLOAD_SECRET_ACCESS_KEY: ${{ secrets.MKETY_R2_DIRECT_UPLOAD_SECRET_ACCESS_KEY }}


  billing-control:
    if: github.ref_name == 'production/mkety-academy'
    needs: production
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      MKETY_MANAGED_HOSTING_OPERATOR_KEY: ${{ secrets.MKETY_MANAGED_HOSTING_OPERATOR_KEY }}
    steps:
      - name: Checkout exact Mkety production pointer
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Verify exact Mkety production pointer and operator secret
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          test -n "${MKETY_MANAGED_HOSTING_OPERATOR_KEY:-}"
          git fetch origin production/mkety-academy:refs/remotes/origin/production/mkety-academy --force
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse origin/production/mkety-academy)" = "$GITHUB_SHA"

      - name: Package shared billing Worker
        run: npx wrangler deploy --dry-run --config workers/billing/wrangler.jsonc --outdir .billing-worker-mkety-release-dry-run

      - name: Deploy shared billing Worker without changing existing secrets
        run: npx wrangler deploy --config workers/billing/wrangler.jsonc --x-provision=false

      - name: Update only the Mkety operator-control secret
        shell: bash
        run: printf '%s' "$MKETY_MANAGED_HOSTING_OPERATOR_KEY" | npx wrangler secret put MKETY_MANAGED_HOSTING_OPERATOR_KEY --config workers/billing/wrangler.jsonc
