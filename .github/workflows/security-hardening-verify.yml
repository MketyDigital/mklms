name: Verify SaaS security hardening

on:
  push:
    branches:
      - feat/saas-security-hardening-2026-09-05
    paths:
      - src/lib/security/rate-limit.ts
      - tests/rate-limit.test.mjs
      - tests/saas-security-hardening.test.mjs
      - wrangler.jsonc
      - src/app/api/**
      - .github/workflows/security-hardening-verify.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Focused security tests
        run: node --experimental-strip-types --test tests/rate-limit.test.mjs tests/saas-security-hardening.test.mjs
