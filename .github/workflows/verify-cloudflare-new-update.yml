name: Verify MkLMS Cloudflare update setup

on:
  push:
    branches:
      - ops/cloudflare-new-update-setup-2026-09-05
    paths:
      - .github/workflows/verify-cloudflare-new-update.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mklms-cloudflare-update-verification
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.MKLMS_R2_DIRECT_UPLOAD_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.MKLMS_R2_DIRECT_UPLOAD_SECRET_ACCESS_KEY }}
      EXPECTED_MAIN_WORKER: mklms
      EXPECTED_MEDIA_WORKER: mklms-media-delivery
      EXPECTED_BILLING_WORKER: mkety-managed-hosting-billing
      EXPECTED_BUCKET: spf-media
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4

      - name: Verify required GitHub secrets are present
        shell: bash
        run: |
          set -euo pipefail
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY; do
            if [ -z "${!name:-}" ]; then
              echo "Missing required GitHub secret backing $name"
              exit 1
            fi
          done
          echo "All four required GitHub secrets are present. Values are not printed."

      - name: Verify exact Cloudflare account contains MkLMS resources
        shell: bash
        run: |
          set -euo pipefail
          auth=(-H "Authorization: Bearer $CLOUDFLARE_API_TOKEN")
          api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID"

          curl -fsS "${auth[@]}" "$api" > /tmp/account.json
          jq -e '.success == true and .result.id != null' /tmp/account.json >/dev/null
          account_name=$(jq -r '.result.name' /tmp/account.json)
          echo "Verified Cloudflare account: $account_name"

          curl -fsS "${auth[@]}" "$api/workers/scripts" > /tmp/scripts.json
          jq -e '.success == true' /tmp/scripts.json >/dev/null
          for worker in "$EXPECTED_MAIN_WORKER" "$EXPECTED_MEDIA_WORKER" "$EXPECTED_BILLING_WORKER"; do
            jq -e --arg worker "$worker" '.result[] | select(.id == $worker)' /tmp/scripts.json >/dev/null || {
              echo "Expected Worker not found in this Cloudflare account: $worker"
              exit 1
            }
            echo "Found expected Worker: $worker"
          done

          curl -fsS "${auth[@]}" "$api/r2/buckets/$EXPECTED_BUCKET" > /tmp/bucket.json
          jq -e '.success == true and .result.name == "spf-media"' /tmp/bucket.json >/dev/null
          echo "Found expected R2 bucket: $EXPECTED_BUCKET"

      - name: Verify existing R2 Worker bindings are exactly where expected
        shell: bash
        run: |
          set -euo pipefail
          auth=(-H "Authorization: Bearer $CLOUDFLARE_API_TOKEN")
          base="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts"

          curl -fsS "${auth[@]}" "$base/$EXPECTED_MAIN_WORKER/settings" > /tmp/main-settings.json
          curl -fsS "${auth[@]}" "$base/$EXPECTED_MEDIA_WORKER/settings" > /tmp/media-settings.json

          jq -e '.success == true' /tmp/main-settings.json >/dev/null
          jq -e '.success == true' /tmp/media-settings.json >/dev/null

          jq -e --arg bucket "$EXPECTED_BUCKET" '.result.bindings[] | select(.name == "APP_STORAGE_BUCKET" and .type == "r2_bucket" and .bucket_name == $bucket)' /tmp/main-settings.json >/dev/null || {
            echo "Main Worker APP_STORAGE_BUCKET is not bound to spf-media. No changes made."
            exit 1
          }
          jq -e --arg bucket "$EXPECTED_BUCKET" '.result.bindings[] | select(.name == "MEDIA_BUCKET" and .type == "r2_bucket" and .bucket_name == $bucket)' /tmp/media-settings.json >/dev/null || {
            echo "Media Worker MEDIA_BUCKET is not bound to spf-media. No changes made."
            exit 1
          }
          echo "Existing main/media R2 bindings are correct."

          echo "Existing integration binding names on main Worker (values hidden):"
          jq -r '.result.bindings[]?.name' /tmp/main-settings.json | sort | grep -E '^(MKLMS_MEDIA_SIGNING_SECRET|MKLMS_MEDIA_DELIVERY_BASE_URL|MKLMS_MANAGED_HOSTING_OPERATOR_KEY|MKLMS_BILLING_SERVICE_URL|MKLMS_BILLING_INSTALLATION_ID|MKLMS_BILLING_SHARED_SECRET)$' || true

      - name: Verify spf-media is not public on r2.dev
        shell: bash
        run: |
          set -euo pipefail
          auth=(-H "Authorization: Bearer $CLOUDFLARE_API_TOKEN")
          url="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/r2/buckets/$EXPECTED_BUCKET/domains/managed"
          curl -fsS "${auth[@]}" "$url" > /tmp/r2-managed-domain.json
          jq -e '.success == true' /tmp/r2-managed-domain.json >/dev/null
          enabled=$(jq -r '.result.enabled' /tmp/r2-managed-domain.json)
          if [ "$enabled" != "false" ]; then
            echo "STOP: spf-media r2.dev public access is enabled. Verification refuses to continue."
            exit 1
          fi
          echo "spf-media r2.dev public access is disabled."

      - name: Discover exact production LMS origin
        shell: bash
        run: |
          set -euo pipefail
          auth=(-H "Authorization: Bearer $CLOUDFLARE_API_TOKEN")
          api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID"

          curl -fsS "${auth[@]}" "$api/workers/domains" > /tmp/worker-domains.json
          jq -e '.success == true' /tmp/worker-domains.json >/dev/null
          count=$(jq --arg service "$EXPECTED_MAIN_WORKER" '[.result[] | select(.service == $service)] | length' /tmp/worker-domains.json)

          if [ "$count" -eq 1 ]; then
            hostname=$(jq -r --arg service "$EXPECTED_MAIN_WORKER" '.result[] | select(.service == $service) | .hostname' /tmp/worker-domains.json)
            origin="https://$hostname"
            echo "Production LMS origin discovered from Worker Custom Domain: $origin"
          elif [ "$count" -eq 0 ]; then
            curl -fsS "${auth[@]}" "$api/workers/scripts/$EXPECTED_MAIN_WORKER/subdomain" > /tmp/script-subdomain.json
            jq -e '.success == true and .result.enabled == true' /tmp/script-subdomain.json >/dev/null || {
              echo "mklms has no custom domain and workers.dev is not enabled. No changes made."
              exit 1
            }
            curl -fsS "${auth[@]}" "$api/workers/subdomain" > /tmp/account-subdomain.json
            jq -e '.success == true and (.result.subdomain | length > 0)' /tmp/account-subdomain.json >/dev/null
            workers_subdomain=$(jq -r '.result.subdomain' /tmp/account-subdomain.json)
            origin="https://$EXPECTED_MAIN_WORKER.$workers_subdomain.workers.dev"
            echo "Production LMS origin discovered from active workers.dev route: $origin"
          else
            echo "mklms has multiple custom domains ($count); refusing to choose one automatically. No changes made."
            jq -r --arg service "$EXPECTED_MAIN_WORKER" '.result[] | select(.service == $service) | .hostname' /tmp/worker-domains.json || true
            exit 1
          fi

          echo "LMS_ORIGIN=$origin" >> "$GITHUB_ENV"

      - name: Verify the new bucket-scoped R2 S3 credentials against spf-media
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.MKLMS_R2_DIRECT_UPLOAD_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.MKLMS_R2_DIRECT_UPLOAD_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          set -euo pipefail
          aws --version
          aws s3api list-objects-v2 \
            --bucket "$EXPECTED_BUCKET" \
            --max-items 1 \
            --endpoint-url "https://$CLOUDFLARE_ACCOUNT_ID.r2.cloudflarestorage.com" \
            >/dev/null
          echo "R2 S3 credentials can access the expected spf-media bucket."

      - name: Read current R2 CORS policy without changing it
        shell: bash
        run: |
          set -euo pipefail
          auth=(-H "Authorization: Bearer $CLOUDFLARE_API_TOKEN")
          url="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/r2/buckets/$EXPECTED_BUCKET/cors"
          curl -fsS "${auth[@]}" "$url" > /tmp/cors.json
          jq -e '.success == true' /tmp/cors.json >/dev/null
          echo "Current spf-media CORS policy (safe fields only):"
          jq '{rules: [.result.rules[]? | {id, allowed, exposeHeaders, maxAgeSeconds}]}' /tmp/cors.json

          has_required=$(jq --arg origin "$LMS_ORIGIN" '[.result.rules[]? | select((.allowed.origins | index($origin)) != null and (.allowed.methods | index("PUT")) != null and ((.allowed.headers // []) | index("Content-Type")) != null)] | length' /tmp/cors.json)
          if [ "$has_required" -gt 0 ]; then
            echo "Required direct-upload PUT CORS rule already exists for $LMS_ORIGIN."
          else
            echo "Required direct-upload PUT CORS rule is missing for $LMS_ORIGIN."
            echo "CORS_UPDATE_REQUIRED=true" >> "$GITHUB_ENV"
          fi

      - name: Verification summary
        shell: bash
        run: |
          set -euo pipefail
          echo "Cloudflare verification completed with zero production mutations."
          echo "Account resource identity: verified"
          echo "Workers: mklms, mklms-media-delivery, mkety-managed-hosting-billing verified"
          echo "R2 bucket: spf-media verified"
          echo "R2 bindings: verified"
          echo "R2 public r2.dev access: disabled"
          echo "R2 S3 direct-upload credentials: verified"
          echo "Production LMS origin: $LMS_ORIGIN"
          echo "CORS update required: ${CORS_UPDATE_REQUIRED:-false}"
