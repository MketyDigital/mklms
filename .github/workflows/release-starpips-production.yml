name: Release Starpips production

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: "Exact SHA currently selected by production/starpips"
        required: true
        type: string
      confirmation:
        description: "Type RELEASE_STARPIPS to deploy the selected production pointer"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-starpips-production
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: starpips
    env:
      RELEASE_SHA: ${{ inputs.release_sha }}
      PRODUCTION_BRANCH: production/starpips
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Require deliberate Starpips confirmation
        shell: bash
        run: |
          set -euo pipefail
          test "${{ inputs.confirmation }}" = "RELEASE_STARPIPS" || {
            echo "confirmation must equal RELEASE_STARPIPS"
            exit 1
          }
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo "release_sha must be a full 40-character commit SHA"
            exit 1
          }
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}" || { echo "Missing CLOUDFLARE_ACCOUNT_ID"; exit 1; }
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo "Missing CLOUDFLARE_API_TOKEN"; exit 1; }

      - name: Checkout exact selected release
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_sha }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Verify Starpips manifest and production pointer
        shell: bash
        run: |
          set -euo pipefail
          npm run installation:validate
          node --input-type=module <<'NODE'
          import { loadConcreteInstallation } from './scripts/installation-config.mjs';
          const { manifest } = await loadConcreteInstallation('starpips');
          if (manifest.productionBranch !== 'production/starpips') throw new Error('Unexpected Starpips production branch.');
          if (manifest.appWorker !== 'mklms') throw new Error('Unexpected Starpips application Worker.');
          if (manifest.mediaWorker !== 'mklms-media-delivery') throw new Error('Unexpected Starpips media Worker.');
          if (manifest.publicDomain !== 'learn.starpipsforex.com') throw new Error('Unexpected Starpips public hostname.');
          if (manifest.domain?.mode !== 'saas-custom-hostname') throw new Error('Starpips must remain a SaaS custom hostname installation.');
          NODE
          git fetch origin "$PRODUCTION_BRANCH:refs/remotes/origin/$PRODUCTION_BRANCH" --force
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          test "$(git rev-parse "origin/$PRODUCTION_BRANCH")" = "$RELEASE_SHA" || {
            echo "release_sha is not the current production/starpips pointer"
            exit 1
          }

      - name: Generate Starpips installation configuration
        shell: bash
        run: |
          set -euo pipefail
          node scripts/generate-installation-config.mjs starpips

      - name: Build and package exact Starpips release
        shell: bash
        env:
          DATABASE_URL: postgresql://build:build@127.0.0.1:5432/mklms
          MKLMS_ADMIN_ACCESS_KEY: build-admin
          MKLMS_ADMIN_SESSION_SECRET: build-session
        run: |
          set -euo pipefail
          npm run cf:build
          npx wrangler deploy --config ".generated/starpips/app.wrangler.jsonc" --dry-run --outdir .generated/starpips-release-app-dry-run --x-provision=false
          npx wrangler deploy --config ".generated/starpips/media.wrangler.jsonc" --dry-run --outdir .generated/starpips-release-media-dry-run --x-provision=false

      - name: Deploy existing Starpips media Worker without changing secrets
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler deploy --config ".generated/starpips/media.wrangler.jsonc" --x-provision=false

      - name: Deploy existing Starpips application Worker without changing secrets
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler deploy --config ".generated/starpips/app.wrangler.jsonc" --x-provision=false

      - name: Smoke test the existing Starpips SaaS hostname
        shell: bash
        run: |
          set -euo pipefail
          curl --silent --show-error --fail --retry 8 --retry-delay 5 --retry-all-errors "https://learn.starpipsforex.com/login" >/dev/null
          curl --silent --show-error --fail --retry 8 --retry-delay 5 --retry-all-errors "https://learn.starpipsforex.com/" >/dev/null
          echo "Starpips production smoke checks passed for $RELEASE_SHA"
