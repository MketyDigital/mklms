name: Release Starpips production

on:
  push:
    branches:
      - production/starpips

permissions:
  contents: read

concurrency:
  group: release-starpips-production
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PRODUCTION_BRANCH: production/starpips
      DATABASE_URL: ${{ secrets.STARPIPS_DATABASE_URL }}
      DATABASE_SSL: ${{ secrets.STARPIPS_DATABASE_SSL }}
    steps:
      - name: Checkout exact Starpips production pointer
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Verify exact Starpips production pointer before database access
        shell: bash
        run: |
          set -euo pipefail
          test -n "${DATABASE_URL:-}" || { echo "Missing repository secret STARPIPS_DATABASE_URL"; exit 1; }
          git fetch origin "$PRODUCTION_BRANCH:refs/remotes/origin/$PRODUCTION_BRANCH" --force
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse "origin/$PRODUCTION_BRANCH")" = "$GITHUB_SHA" || {
            echo "GitHub event SHA is not the current production/starpips pointer"
            exit 1
          }

      - name: Verify Starpips historical migration ledger is safe
        run: >-
          node scripts/starpips-migration-guard.mjs verify
          018_certificate_visual_layout_and_starpips_calibration.sql
          019_managed_hosting_daily_ledger.sql
          020_managed_hosting_payment_settlement.sql

      - name: Apply only guarded additive Starpips migrations 018 through 020 when pending
        run: >-
          node scripts/starpips-migration-guard.mjs apply
          018_certificate_visual_layout_and_starpips_calibration.sql
          019_managed_hosting_daily_ledger.sql
          020_managed_hosting_payment_settlement.sql

      - name: Verify Starpips migrations 018 through 020 are current
        run: >-
          node scripts/starpips-migration-guard.mjs verify
          018_certificate_visual_layout_and_starpips_calibration.sql
          019_managed_hosting_daily_ledger.sql
          020_managed_hosting_payment_settlement.sql

  release:
    needs: migrate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      RELEASE_SHA: ${{ github.sha }}
      PRODUCTION_BRANCH: production/starpips
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Checkout exact selected release
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Verify Starpips manifest and production pointer
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}" || { echo "Missing repository secret CLOUDFLARE_ACCOUNT_ID"; exit 1; }
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo "Missing repository secret CLOUDFLARE_API_TOKEN"; exit 1; }
          npm run installation:validate
          node --input-type=module <<'NODE'
          import { loadConcreteInstallation } from './scripts/installation-config.mjs';
          const { manifest } = await loadConcreteInstallation('starpips');
          if (manifest.productionBranch !== 'production/starpips') throw new Error('Unexpected Starpips production branch.');
          if (manifest.appWorker !== 'mklms') throw new Error('Unexpected Starpips application Worker.');
          if (manifest.mediaWorker !== 'mklms-media-delivery') throw new Error('Unexpected Starpips media Worker.');
          if (manifest.publicDomain !== 'learn.starpipsforex.com') throw new Error('Unexpected Starpips public hostname.');
          if (manifest.domain?.mode !== 'saas-custom-hostname') throw new Error('Starpips must remain a SaaS custom hostname installation.');
          NODE
          git fetch origin "$PRODUCTION_BRANCH:refs/remotes/origin/$PRODUCTION_BRANCH" --force
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse "origin/$PRODUCTION_BRANCH")" = "$GITHUB_SHA" || {
            echo "GitHub event SHA is not the current production/starpips pointer"
            exit 1
          }

      - name: Detect which production surfaces actually changed
        shell: bash
        run: |
          set -euo pipefail
          before="${{ github.event.before }}"
          media_changed=false
          billing_changed=false
          if git cat-file -e "$before^{commit}" 2>/dev/null; then
            if ! git diff --quiet "$before" "$GITHUB_SHA" -- workers/media-delivery scripts/generate-installation-config.mjs deploy/installations/starpips.json; then
              media_changed=true
            fi
            if ! git diff --quiet "$before" "$GITHUB_SHA" -- workers/billing; then
              billing_changed=true
            fi
          else
            media_changed=true
            billing_changed=true
          fi
          echo "MEDIA_CHANGED=$media_changed" >> "$GITHUB_ENV"
          echo "BILLING_CHANGED=$billing_changed" >> "$GITHUB_ENV"
          echo "media_changed=$media_changed billing_changed=$billing_changed"

      - name: Generate Starpips installation configuration
        run: node scripts/generate-installation-config.mjs starpips

      - name: Build and package exact Starpips release
        shell: bash
        env:
          DATABASE_URL: postgresql://build:build@127.0.0.1:5432/mklms
          MKLMS_ADMIN_ACCESS_KEY: build-admin
          MKLMS_ADMIN_SESSION_SECRET: build-session
        run: |
          set -euo pipefail
          npm run cf:build
          npx wrangler deploy --config ".generated/starpips/app.wrangler.jsonc" --dry-run --outdir .generated/starpips-release-app-dry-run --x-provision=false
          npx wrangler deploy --config ".generated/starpips/media.wrangler.jsonc" --dry-run --outdir .generated/starpips-release-media-dry-run --x-provision=false
          npx wrangler deploy --dry-run --config workers/billing/wrangler.jsonc --outdir .generated/starpips-release-billing-dry-run

      - name: Deploy existing Starpips media Worker only when its release surface changed
        if: env.MEDIA_CHANGED == 'true'
        run: npx wrangler deploy --config ".generated/starpips/media.wrangler.jsonc" --x-provision=false

      - name: Deploy existing Starpips application Worker without changing secrets
        run: npx wrangler deploy --config ".generated/starpips/app.wrangler.jsonc" --x-provision=false

      - name: Deploy shared managed-hosting billing Worker only when its code changed
        if: env.BILLING_CHANGED == 'true'
        run: npx wrangler deploy --config workers/billing/wrangler.jsonc --x-provision=false

      - name: Smoke test the existing Starpips SaaS hostname
        shell: bash
        run: |
          set -euo pipefail
          curl --silent --show-error --fail --retry 8 --retry-delay 5 --retry-all-errors "https://learn.starpipsforex.com/login" >/dev/null
          curl --silent --show-error --fail --retry 8 --retry-delay 5 --retry-all-errors "https://learn.starpipsforex.com/" >/dev/null
          echo "Starpips production smoke checks passed for $RELEASE_SHA"
