name: Compare Starpips live class video timing (read-only)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Verify Cloudflare read credentials are available
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}" || { echo "Missing CLOUDFLARE_ACCOUNT_ID"; exit 1; }
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo "Missing CLOUDFLARE_API_TOKEN"; exit 1; }

      - name: Install ffprobe
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ffmpeg

      - name: Read video duration and stream timing from R2
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import subprocess
          import tempfile
          import urllib.parse
          import urllib.request

          account = os.environ["CLOUDFLARE_ACCOUNT_ID"]
          token = os.environ["CLOUDFLARE_API_TOKEN"]
          bucket = "spf-media"
          base = f"https://api.cloudflare.com/client/v4/accounts/{account}/r2/buckets/{bucket}/objects"

          def get_json(url):
              request = urllib.request.Request(url, headers={"Authorization": f"Bearer {token}"})
              with urllib.request.urlopen(request, timeout=60) as response:
                  return json.load(response)

          listing = get_json(base + "?prefix=live-classes%2F&per_page=1000")
          if not listing.get("success"):
              raise RuntimeError("Cloudflare did not return the live-classes object listing.")
          listed = listing.get("result") or []
          originals = [
              item for item in listed
              if (item.get("key") or "").lower().endswith((".mp4", ".m4v"))
          ]
          originals.sort(key=lambda item: item.get("key") or "")
          print("Original live-classes video inventory:")
          print(json.dumps([
              {"key": item.get("key"), "size": item.get("size"), "uploaded": item.get("uploaded") or item.get("last_modified")}
              for item in originals
          ], indent=2))

          target_key = "media/bfa8765a-33b9-4686-b846-19e1bcf4f941.mp4"
          candidates = [{"key": target_key, "size": 462506030, "label": "Day two edited upload"}]
          candidates.extend(
              {"key": item["key"], "size": item.get("size"), "label": "existing live-classes original"}
              for item in originals
          )
          if len(candidates) > 8:
              candidates = candidates[:8]

          summaries = []
          for item in candidates:
              key = item["key"]
              url = base + "/" + urllib.parse.quote(key, safe="/")
              request = urllib.request.Request(url, headers={"Authorization": f"Bearer {token}"})
              tmp_path = None
              try:
                  with urllib.request.urlopen(request, timeout=120) as response:
                      fd, tmp_path = tempfile.mkstemp(suffix=".mp4")
                      os.close(fd)
                      downloaded = 0
                      with open(tmp_path, "wb") as output:
                          while True:
                              chunk = response.read(1024 * 1024)
                              if not chunk:
                                  break
                              output.write(chunk)
                              downloaded += len(chunk)
                  probe = subprocess.run(
                      ["ffprobe", "-v", "error", "-show_entries",
                       "format=format_name,duration,start_time:format_tags=creation_time,major_brand",
                       "-show_entries",
                       "stream=index,codec_type,codec_name,start_time,duration,avg_frame_rate,width,height,sample_rate,channels",
                       "-of", "json", tmp_path],
                      check=True, capture_output=True, text=True, timeout=180,
                  )
                  result = json.loads(probe.stdout)
                  summaries.append({
                      "label": item["label"],
                      "key": key,
                      "listedBytes": item.get("size"),
                      "downloadedBytes": downloaded,
                      "ffprobe": result,
                  })
              finally:
                  if tmp_path and os.path.exists(tmp_path):
                      os.remove(tmp_path)
          print("Video stream and duration comparison:")
          print(json.dumps(summaries, indent=2))
          PY
