name: Verify Cloudflare Starpips Worker (read-only)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-cloudflare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_WORKER_NAME: mklms
    steps:
      - name: Verify required Cloudflare secrets are present
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "Missing GitHub secret CLOUDFLARE_ACCOUNT_ID"
            exit 1
          fi
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "Missing GitHub secret CLOUDFLARE_API_TOKEN"
            exit 1
          fi

      - name: Read Worker settings safely
        shell: bash
        run: |
          set -euo pipefail
          response_file="$(mktemp)"
          trap 'rm -f "$response_file"' EXIT

          curl --fail-with-body --silent --show-error --request GET \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${CLOUDFLARE_WORKER_NAME}/settings" \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            --header "Content-Type: application/json" \
            --output "$response_file"

          if [ "$(jq -r '.success' "$response_file")" != "true" ]; then
            echo "Cloudflare Worker settings request was not successful"
            jq -r '.errors[]?.message // empty' "$response_file"
            exit 1
          fi

          echo "Cloudflare Worker settings are readable."
          echo "Worker: ${CLOUDFLARE_WORKER_NAME}"
          jq -r '[.result.bindings[]? | {name, type}] | sort_by(.name) | .[] | "Binding: \(.name) [\(.type)]"' "$response_file"

      - name: Read Worker deployments safely
        shell: bash
        run: |
          set -euo pipefail
          response_file="$(mktemp)"
          trap 'rm -f "$response_file"' EXIT

          curl --fail-with-body --silent --show-error --request GET \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${CLOUDFLARE_WORKER_NAME}/deployments" \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            --header "Content-Type: application/json" \
            --output "$response_file"

          if [ "$(jq -r '.success' "$response_file")" != "true" ]; then
            echo "Cloudflare Worker deployments request was not successful"
            jq -r '.errors[]?.message // empty' "$response_file"
            exit 1
          fi

          echo "Cloudflare Worker deployments are readable."
          jq -r '"Deployment count: \(.result.deployments | length)"' "$response_file"
          jq -r '.result.deployments[0]? | "Latest deployment: \(.id) created \(.created_on) source=\(.source)"' "$response_file"
