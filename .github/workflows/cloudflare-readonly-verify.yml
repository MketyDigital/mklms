name: Verify Cloudflare Installation (read-only)

on:
  workflow_dispatch:
    inputs:
      installation:
        description: Installation to verify
        required: true
        type: choice
        options:
          - starpips
          - mkety-academy

permissions:
  contents: read

jobs:
  verify-cloudflare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      INSTALLATION_ID: ${{ inputs.installation }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Verify required Cloudflare secrets are present
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "Missing GitHub secret CLOUDFLARE_ACCOUNT_ID"
            exit 1
          fi
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "Missing GitHub secret CLOUDFLARE_API_TOKEN"
            exit 1
          fi

      - name: Validate selected installation manifest
        shell: bash
        run: |
          set -euo pipefail
          npm run installation:validate
          MANIFEST_PATH="deploy/installations/${INSTALLATION_ID}.json"
          test -f "$MANIFEST_PATH"
          test "$(jq -r '.deployable' "$MANIFEST_PATH")" = "true"
          test "$(jq -r '.id' "$MANIFEST_PATH")" = "$INSTALLATION_ID"
          echo "MANIFEST_PATH=$MANIFEST_PATH" >> "$GITHUB_ENV"
          echo "APP_WORKER=$(jq -r '.appWorker' "$MANIFEST_PATH")" >> "$GITHUB_ENV"
          echo "MEDIA_WORKER=$(jq -r '.mediaWorker' "$MANIFEST_PATH")" >> "$GITHUB_ENV"
          echo "PUBLIC_DOMAIN=$(jq -r '.publicDomain' "$MANIFEST_PATH")" >> "$GITHUB_ENV"
          echo "DOMAIN_MODE=$(jq -r '.domain.mode' "$MANIFEST_PATH")" >> "$GITHUB_ENV"
          node --input-type=module <<'NODE'
          import { appendFileSync } from 'node:fs';
          import { loadConcreteInstallation } from './scripts/installation-config.mjs';
          import { loadSaasPlatform } from './scripts/saas-platform.mjs';
          const { manifest } = await loadConcreteInstallation(process.env.INSTALLATION_ID);
          const { platform } = await loadSaasPlatform(manifest.domain.platformId);
          appendFileSync(process.env.GITHUB_ENV, `PROVIDER_ZONE=${platform.providerZone}\n`);
          NODE

      - name: Read and verify application Worker safely
        shell: bash
        run: |
          set -euo pipefail
          settings_file="$(mktemp)"
          deployments_file="$(mktemp)"
          trap 'rm -f "$settings_file" "$deployments_file"' EXIT

          curl --fail-with-body --silent --show-error --request GET \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${APP_WORKER}/settings" \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            --header "Content-Type: application/json" \
            --output "$settings_file"

          node scripts/verify-cloudflare-response.mjs "$MANIFEST_PATH" app "$settings_file"

          curl --fail-with-body --silent --show-error --request GET \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${APP_WORKER}/deployments" \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            --header "Content-Type: application/json" \
            --output "$deployments_file"

          test "$(jq -r '.success' "$deployments_file")" = "true"
          echo "Application Worker deployments are readable."
          jq -r '"Deployment count: \(.result.deployments | length)"' "$deployments_file"

      - name: Read and verify media Worker safely
        shell: bash
        run: |
          set -euo pipefail
          settings_file="$(mktemp)"
          deployments_file="$(mktemp)"
          trap 'rm -f "$settings_file" "$deployments_file"' EXIT

          curl --fail-with-body --silent --show-error --request GET \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${MEDIA_WORKER}/settings" \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            --header "Content-Type: application/json" \
            --output "$settings_file"

          node scripts/verify-cloudflare-response.mjs "$MANIFEST_PATH" media "$settings_file"

          curl --fail-with-body --silent --show-error --request GET \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${MEDIA_WORKER}/deployments" \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            --header "Content-Type: application/json" \
            --output "$deployments_file"

          test "$(jq -r '.success' "$deployments_file")" = "true"
          echo "Media Worker deployments are readable."
          jq -r '"Deployment count: \(.result.deployments | length)"' "$deployments_file"

      - name: Read and verify SaaS Custom Hostname and Worker route
        if: env.DOMAIN_MODE == 'saas-custom-hostname'
        shell: bash
        run: |
          set -euo pipefail
          zone_file="$(mktemp)"
          hostname_file="$(mktemp)"
          routes_file="$(mktemp)"
          trap 'rm -f "$zone_file" "$hostname_file" "$routes_file"' EXIT

          curl --fail-with-body --silent --show-error --request GET \
            "https://api.cloudflare.com/client/v4/zones?name=${PROVIDER_ZONE}&account.id=${CLOUDFLARE_ACCOUNT_ID}" \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            --header "Content-Type: application/json" \
            --output "$zone_file"
          test "$(jq -r '.success' "$zone_file")" = "true"
          test "$(jq -r '.result | length' "$zone_file")" = "1"
          ZONE_ID=$(jq -r '.result[0].id' "$zone_file")

          curl --fail-with-body --silent --show-error --request GET --get \
            "https://api.cloudflare.com/client/v4/zones/${ZONE_ID}/custom_hostnames" \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            --header "Content-Type: application/json" \
            --data-urlencode "hostname=${PUBLIC_DOMAIN}" \
            --output "$hostname_file"

          curl --fail-with-body --silent --show-error --request GET \
            "https://api.cloudflare.com/client/v4/zones/${ZONE_ID}/workers/routes" \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            --header "Content-Type: application/json" \
            --output "$routes_file"

          node --input-type=module "$hostname_file" "$routes_file" <<'NODE'
          import { readFileSync } from 'node:fs';
          import { loadConcreteInstallation } from './scripts/installation-config.mjs';
          import { loadSaasPlatform } from './scripts/saas-platform.mjs';
          import { resolveSaasDomainPlan } from './scripts/cloudflare-saas-domain.mjs';
          const [hostnamePath, routesPath] = process.argv.slice(2);
          const { manifest } = await loadConcreteInstallation(process.env.INSTALLATION_ID);
          const { platform } = await loadSaasPlatform(manifest.domain.platformId);
          const customHostnames = JSON.parse(readFileSync(hostnamePath, 'utf8')).result ?? [];
          const workerRoutes = JSON.parse(readFileSync(routesPath, 'utf8')).result ?? [];
          const plan = resolveSaasDomainPlan({ manifest, platform, customHostnames, workerRoutes });
          if (plan.createCustomHostname || plan.createWorkerRoute) throw new Error('SaaS domain provisioning is incomplete or does not match the selected installation.');
          console.log(`SaaS Custom Hostname is present for ${plan.hostname}.`);
          console.log(`Exact Worker route matches ${plan.routePattern} -> ${plan.appWorker}.`);
          console.log(`SSL sub-status is informational; application HTTPS smoke is the readiness gate.`);
          NODE
