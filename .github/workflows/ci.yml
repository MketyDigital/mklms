name: MkLMS CI

on:
  pull_request:
    branches:
      - architecture/mklms-reusable-platform
      - main
  push:
    branches:
      - feature/mklms-phase-1-foundation-access

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package.json

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Domain and service tests
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Production build
        run: npm run build
