name: Deploy MkLMS installation production

on:
  workflow_dispatch:
    inputs:
      installation_id:
        description: "Concrete installation id"
        required: true
        type: string
      release_sha:
        description: "Exact promoted production branch SHA"
        required: true
        type: string
  workflow_call:
    inputs:
      installation_id:
        required: true
        type: string
      release_sha:
        required: true
        type: string
    secrets:
      CLOUDFLARE_ACCOUNT_ID:
        required: true
      CLOUDFLARE_API_TOKEN:
        required: true
      MKLMS_ADMIN_ACCESS_KEY:
        required: true
      MKLMS_ADMIN_SESSION_SECRET:
        required: true
      MKLMS_MEDIA_SIGNING_SECRET:
        required: true
      MKLMS_BILLING_SERVICE_URL:
        required: false
      MKLMS_BILLING_SHARED_SECRET:
        required: false
      R2_DIRECT_UPLOAD_ACCESS_KEY_ID:
        required: false
      R2_DIRECT_UPLOAD_SECRET_ACCESS_KEY:
        required: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment: ${{ inputs.installation_id }}
    env:
      INSTALLATION_ID: ${{ inputs.installation_id }}
      RELEASE_SHA: ${{ inputs.release_sha }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      ADMIN_ACCESS_KEY: ${{ secrets.MKLMS_ADMIN_ACCESS_KEY }}
      ADMIN_SESSION_SECRET: ${{ secrets.MKLMS_ADMIN_SESSION_SECRET }}
      MEDIA_SIGNING_SECRET: ${{ secrets.MKLMS_MEDIA_SIGNING_SECRET }}
      BILLING_SERVICE_URL: ${{ secrets.MKLMS_BILLING_SERVICE_URL }}
      BILLING_SHARED_SECRET: ${{ secrets.MKLMS_BILLING_SHARED_SECRET }}
      R2_DIRECT_UPLOAD_ACCESS_KEY_ID: ${{ secrets.R2_DIRECT_UPLOAD_ACCESS_KEY_ID }}
      R2_DIRECT_UPLOAD_SECRET_ACCESS_KEY: ${{ secrets.R2_DIRECT_UPLOAD_SECRET_ACCESS_KEY }}
    steps:
      - name: Checkout exact release SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_sha }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Resolve selected production target
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "release_sha must be a full commit SHA"; exit 1; }
          for name in CLOUDFLARE_ACCOUNT_ID CLOUDFLARE_API_TOKEN ADMIN_ACCESS_KEY ADMIN_SESSION_SECRET MEDIA_SIGNING_SECRET; do
            test -n "${!name:-}" || { echo "Missing required production secret: $name"; exit 1; }
          done
          if { [ -n "$R2_DIRECT_UPLOAD_ACCESS_KEY_ID" ] && [ -z "$R2_DIRECT_UPLOAD_SECRET_ACCESS_KEY" ]; } || \
             { [ -z "$R2_DIRECT_UPLOAD_ACCESS_KEY_ID" ] && [ -n "$R2_DIRECT_UPLOAD_SECRET_ACCESS_KEY" ]; }; then
            echo "Direct-upload R2 credentials must be configured as a complete pair"
            exit 1
          fi
          npm run installation:validate
          node --input-type=module <<'NODE'
          import { appendFileSync } from 'node:fs';
          import { loadConcreteInstallation } from './scripts/installation-config.mjs';
          import { assertReleaseBranch } from './scripts/installation-release.mjs';
          const { manifest } = await loadConcreteInstallation(process.env.INSTALLATION_ID);
          if (!manifest.dnsZone || typeof manifest.dnsZone !== 'string') {
            throw new Error('Production installation must declare dnsZone before custom-domain deployment.');
          }
          assertReleaseBranch(manifest, manifest.productionBranch);
          const pairs = {
            PRODUCTION_BRANCH: manifest.productionBranch,
            APP_WORKER: manifest.appWorker,
            MEDIA_WORKER: manifest.mediaWorker,
            R2_BUCKET: manifest.r2Bucket,
            PUBLIC_DOMAIN: manifest.publicDomain,
            DNS_ZONE: manifest.dnsZone,
            BILLING_INSTALLATION_ID: manifest.billingInstallationId,
          };
          for (const [key, value] of Object.entries(pairs)) appendFileSync(process.env.GITHUB_ENV, `${key}=${value}\n`);
          NODE

      - name: Validate production branch ownership and release pointer
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$PRODUCTION_BRANCH:refs/remotes/origin/$PRODUCTION_BRANCH" --force
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          test "$(git rev-parse "origin/$PRODUCTION_BRANCH")" = "$RELEASE_SHA" || {
            echo "Release SHA is not the current selected production branch pointer"
            exit 1
          }

      - name: Generate and package production Workers
        shell: bash
        env:
          DATABASE_URL: postgresql://build:build@127.0.0.1:5432/mklms
          MKLMS_ADMIN_ACCESS_KEY: build-admin
          MKLMS_ADMIN_SESSION_SECRET: build-session
        run: |
          set -euo pipefail
          node scripts/generate-installation-config.mjs "$INSTALLATION_ID"
          npm run cf:build
          npx wrangler deploy --config ".generated/$INSTALLATION_ID/app.wrangler.jsonc" --dry-run --outdir .generated/production-app-dry-run --x-provision=false
          npx wrangler deploy --config ".generated/$INSTALLATION_ID/media.wrangler.jsonc" --dry-run --outdir .generated/production-media-dry-run --x-provision=false

      - name: Deploy production media Worker
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler deploy --config ".generated/$INSTALLATION_ID/media.wrangler.jsonc" --x-provision=false
          jq -n --arg signing "$MEDIA_SIGNING_SECRET" '{MKLMS_MEDIA_SIGNING_SECRET:$signing}' >/tmp/media-secrets.json
          npx wrangler secret bulk /tmp/media-secrets.json --name "$MEDIA_WORKER"
          rm -f /tmp/media-secrets.json
          curl --silent --show-error --fail-with-body --request POST \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$MEDIA_WORKER/subdomain" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H 'Content-Type: application/json' \
            --data '{"enabled":true,"previews_enabled":true}' >/tmp/media-subdomain.json
          jq -e '.success == true' /tmp/media-subdomain.json >/dev/null
          rm -f /tmp/media-subdomain.json

      - name: Resolve production media URL
        id: urls
        shell: bash
        run: |
          set -euo pipefail
          curl --silent --show-error --fail-with-body --request GET \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" >/tmp/account-subdomain.json
          jq -e '.success == true' /tmp/account-subdomain.json >/dev/null
          subdomain=$(jq -r '.result.subdomain' /tmp/account-subdomain.json)
          test -n "$subdomain"
          echo "media_url=https://$MEDIA_WORKER.$subdomain.workers.dev" >> "$GITHUB_OUTPUT"
          rm -f /tmp/account-subdomain.json

      - name: Configure production R2 direct-upload CORS
        shell: bash
        run: |
          set -euo pipefail
          jq -n --arg production "https://$PUBLIC_DOMAIN" \
            '{rules:[{allowed:{methods:["PUT"],origins:[$production],headers:["Content-Type"]},exposeHeaders:["ETag"],maxAgeSeconds:3600}]}' >/tmp/r2-cors.json
          curl --silent --show-error --fail-with-body --request PUT \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/r2/buckets/$R2_BUCKET/cors" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H 'Content-Type: application/json' \
            --data @/tmp/r2-cors.json >/tmp/r2-cors-response.json
          jq -e '.success == true' /tmp/r2-cors-response.json >/dev/null
          rm -f /tmp/r2-cors.json /tmp/r2-cors-response.json

      - name: Deploy production application Worker and secrets
        shell: bash
        env:
          MEDIA_URL: ${{ steps.urls.outputs.media_url }}
        run: |
          set -euo pipefail
          npx wrangler deploy --config ".generated/$INSTALLATION_ID/app.wrangler.jsonc" --x-provision=false
          jq -n \
            --arg adminKey "$ADMIN_ACCESS_KEY" \
            --arg adminSession "$ADMIN_SESSION_SECRET" \
            --arg mediaUrl "$MEDIA_URL" \
            --arg mediaSigning "$MEDIA_SIGNING_SECRET" \
            --arg billingId "$BILLING_INSTALLATION_ID" \
            --arg billingUrl "$BILLING_SERVICE_URL" \
            --arg billingShared "$BILLING_SHARED_SECRET" \
            --arg bucket "$R2_BUCKET" \
            --arg endpoint "https://$CLOUDFLARE_ACCOUNT_ID.r2.cloudflarestorage.com" \
            --arg r2Access "$R2_DIRECT_UPLOAD_ACCESS_KEY_ID" \
            --arg r2Secret "$R2_DIRECT_UPLOAD_SECRET_ACCESS_KEY" \
            '{
              MKLMS_ADMIN_ACCESS_KEY:$adminKey,
              MKLMS_ADMIN_SESSION_SECRET:$adminSession,
              MKLMS_ACCESS_CODE_PREFIX:"ACCESS",
              MKLMS_CLAIM_VERIFICATION_STRATEGY:"preauth-only",
              MKLMS_STUDENT_SESSION_TTL_SECONDS:"1209600",
              MKLMS_MEDIA_DELIVERY_BASE_URL:$mediaUrl,
              MKLMS_MEDIA_SIGNING_SECRET:$mediaSigning,
              MKLMS_BILLING_INSTALLATION_ID:$billingId,
              MKLMS_R2_DIRECT_UPLOAD_BUCKET:$bucket,
              MKLMS_R2_DIRECT_UPLOAD_ENDPOINT:$endpoint
            }
            + (if $billingUrl == "" then {} else {MKLMS_BILLING_SERVICE_URL:$billingUrl} end)
            + (if $billingShared == "" then {} else {MKLMS_BILLING_SHARED_SECRET:$billingShared} end)
            + (if $r2Access == "" then {} else {MKLMS_R2_DIRECT_UPLOAD_ACCESS_KEY_ID:$r2Access} end)
            + (if $r2Secret == "" then {} else {MKLMS_R2_DIRECT_UPLOAD_SECRET_ACCESS_KEY:$r2Secret} end)' >/tmp/app-secrets.json
          npx wrangler secret bulk /tmp/app-secrets.json --name "$APP_WORKER"
          rm -f /tmp/app-secrets.json

      - name: Attach selected production custom domain
        shell: bash
        run: |
          set -euo pipefail
          jq -n --arg hostname "$PUBLIC_DOMAIN" --arg service "$APP_WORKER" --arg zone "$DNS_ZONE" \
            '{hostname:$hostname,service:$service,zone_name:$zone}' >/tmp/domain.json
          curl --silent --show-error --fail-with-body --request PUT \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/domains" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H 'Content-Type: application/json' \
            --data @/tmp/domain.json >/tmp/domain-response.json
          jq -e '.success == true' /tmp/domain-response.json >/dev/null
          rm -f /tmp/domain.json /tmp/domain-response.json

      - name: Smoke test installation production
        shell: bash
        run: |
          set -euo pipefail
          APP_URL="https://$PUBLIC_DOMAIN"
          curl --silent --show-error --fail --retry 8 --retry-delay 5 --retry-all-errors "$APP_URL/login" >/dev/null
          curl --silent --show-error --fail --retry 8 --retry-delay 5 --retry-all-errors "$APP_URL/" >/dev/null
          echo "Installation production smoke checks passed: $APP_URL"
