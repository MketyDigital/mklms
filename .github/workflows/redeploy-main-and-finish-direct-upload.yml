name: Inspect MkLMS deployed rate limit bindings

on:
  push:
    branches:
      - ops/cloudflare-new-update-setup-2026-09-05
    paths:
      - .github/workflows/redeploy-main-and-finish-direct-upload.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Read live Worker rate-limit binding configuration
        shell: bash
        run: |
          set -euo pipefail
          auth=(-H "Authorization: Bearer $CLOUDFLARE_API_TOKEN")
          script=mklms

          curl -fsS "${auth[@]}" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$script/settings" > /tmp/settings.json
          jq -e '.success == true' /tmp/settings.json >/dev/null

          echo "=== LIVE RATE LIMIT BINDINGS ==="
          jq -c '.result.bindings[]? | select(.type == "ratelimit") | {name,type,namespace_id,simple}' /tmp/settings.json
          count=$(jq '[.result.bindings[]? | select(.type == "ratelimit")] | length' /tmp/settings.json)
          echo "RATE_LIMIT_BINDING_COUNT=$count"
          test "$count" = "5"

          echo "=== FULL AUTH BINDING ==="
          jq -c '.result.bindings[]? | select(.name == "AUTH_RATE_LIMITER")' /tmp/settings.json
          echo "LIVE_RATE_LIMIT_BINDING_INSPECTION_COMPLETE"
