name: Verify MkLMS production auth limiter behavior

on:
  push:
    branches:
      - ops/cloudflare-new-update-setup-2026-09-05
    paths:
      - .github/workflows/redeploy-main-and-finish-direct-upload.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Sustain harmless invalid claim attempts against production
        shell: bash
        run: |
          set -euo pipefail
          url='https://learn.starpipsforex.com/api/access/claim'
          body='{}'
          saw_429=0
          first_429=0
          echo "=== PRODUCTION AUTH LIMITER SUSTAINED PROBE ==="
          for i in $(seq 1 45); do
            headers=$(mktemp)
            response=$(mktemp)
            code=$(curl -sS -D "$headers" -o "$response" -w '%{http_code}' -X POST "$url" -H 'content-type: application/json' --data "$body")
            ray=$(awk 'BEGIN{IGNORECASE=1} /^cf-ray:/ {gsub("\r", ""); print $2}' "$headers" | tail -1)
            retry=$(awk 'BEGIN{IGNORECASE=1} /^retry-after:/ {gsub("\r", ""); print $2}' "$headers" | tail -1)
            printf 'request=%02d status=%s retry_after=%s ray=%s\n' "$i" "$code" "${retry:-}" "${ray:-none}"
            if [ "$code" = "429" ] && [ "$saw_429" = "0" ]; then
              saw_429=1
              first_429=$i
            fi
            rm -f "$headers" "$response"
            sleep 1
          done
          echo "SAW_429=$saw_429"
          echo "FIRST_429_AT=$first_429"
          echo "PRODUCTION_AUTH_LIMITER_PROBE_COMPLETE"
