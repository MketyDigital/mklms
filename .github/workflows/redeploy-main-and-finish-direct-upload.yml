name: Stress MkLMS preview limiter consistency

on:
  push:
    branches:
      - ops/cloudflare-new-update-setup-2026-09-05
    paths:
      - .github/workflows/redeploy-main-and-finish-direct-upload.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Sustain direct binding calls and record edge location
        shell: bash
        run: |
          set -euo pipefail
          url='https://fix-rate-limit-runtime-diagnostics-2026-09-05-mklms.dry-glitter-7e16.workers.dev/api/debug-rate-limit-probe'
          saw_false=0
          false_at=0
          echo "=== SUSTAINED PREVIEW LIMITER PROBE ==="
          for i in $(seq 1 40); do
            headers=$(mktemp)
            body=$(mktemp)
            code=$(curl -sS -D "$headers" -o "$body" -w '%{http_code}' "$url")
            ray=$(awk 'BEGIN{IGNORECASE=1} /^cf-ray:/ {gsub("\r", ""); print $2}' "$headers" | tail -1)
            success=$(jq -r '.success // "missing"' "$body" 2>/dev/null || echo invalid-json)
            printf 'probe=%02d status=%s success=%s ray=%s\n' "$i" "$code" "$success" "${ray:-none}"
            test "$code" = "200"
            if [ "$success" = "false" ] && [ "$saw_false" = "0" ]; then
              saw_false=1
              false_at=$i
            fi
            rm -f "$headers" "$body"
            sleep 0.5
          done
          echo "SAW_SUCCESS_FALSE=$saw_false"
          echo "FIRST_FALSE_AT=$false_at"
          echo "SUSTAINED_PREVIEW_LIMITER_PROBE_COMPLETE"
