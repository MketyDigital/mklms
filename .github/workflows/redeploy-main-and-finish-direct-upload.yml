name: Recheck MkLMS SaaS WAF propagation

on:
  push:
    branches:
      - ops/cloudflare-new-update-setup-2026-09-05
    paths:
      - .github/workflows/redeploy-main-and-finish-direct-upload.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Read-only verify SaaS custom WAF behavior
        shell: bash
        run: |
          set -euo pipefail
          auth=(-H "Authorization: Bearer $CLOUDFLARE_API_TOKEN")
          zone_name=mkety.com
          host=learn.starpipsforex.com
          description='Mkety block impossible exploit probes'

          zones=$(curl -fsS "${auth[@]}" "https://api.cloudflare.com/client/v4/zones?account.id=$CLOUDFLARE_ACCOUNT_ID&name=$zone_name")
          zone_id=$(printf '%s' "$zones" | jq -r '.result[0].id // empty')
          test -n "$zone_id"

          echo "=== CURRENT RULE ==="
          curl -fsS "${auth[@]}" "https://api.cloudflare.com/client/v4/zones/$zone_id/rulesets/phases/http_request_firewall_custom/entrypoint" > /tmp/rules.json
          jq -c --arg d "$description" '.result.rules[]? | select(.description == $d) | {id,description,action,expression,enabled,last_updated}' /tmp/rules.json

          echo "=== ROOT ==="
          root_code=$(curl -sS -D /tmp/root.headers -o /tmp/root.html -w '%{http_code}' --connect-timeout 8 --max-time 15 "https://$host/")
          echo "ROOT_HTTP=$root_code"
          grep -Ei '^(cf-ray:|cf-mitigated:|server:)' /tmp/root.headers || true
          echo "ROOT_TITLE=$(grep -oPm1 '(?<=<title>)[^<]+' /tmp/root.html || true)"

          for path in '/.env' '/wp-login.php' '/.git/config' '/phpmyadmin/'; do
            safe=$(printf '%s' "$path" | tr '/.' '__')
            code=$(curl -sS -D "/tmp/${safe}.headers" -o "/tmp/${safe}.body" -w '%{http_code}' --connect-timeout 8 --max-time 15 "https://$host$path" || true)
            echo "PROBE path=$path http=$code"
            grep -Ei '^(cf-ray:|cf-mitigated:|server:)' "/tmp/${safe}.headers" || true
          done

          test "$root_code" = "200"
          grep -q 'STARPIPSFOREX' /tmp/root.html
          echo "READ_ONLY_SAAS_WAF_RECHECK_COMPLETE"
