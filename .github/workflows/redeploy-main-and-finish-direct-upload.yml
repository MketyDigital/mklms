name: Inspect MkLMS production rate limit bindings

on:
  push:
    branches:
      - ops/cloudflare-new-update-setup-2026-09-05
    paths:
      - .github/workflows/redeploy-main-and-finish-direct-upload.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Read current production Worker settings and deployment
        shell: bash
        run: |
          set -euo pipefail
          auth=(-H "Authorization: Bearer $CLOUDFLARE_API_TOKEN")
          base="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers"

          echo "=== CURRENT MKLMS SCRIPT SETTINGS ==="
          curl -fsS "${auth[@]}" "$base/scripts/mklms/settings" > /tmp/settings.json
          jq -e '.success == true' /tmp/settings.json >/dev/null
          jq -c '{bindings:[.result.bindings[]? | select(.type == "ratelimit") | {name,type,namespace_id,simple}], compatibility_date:.result.compatibility_date, compatibility_flags:.result.compatibility_flags}' /tmp/settings.json

          echo "=== CURRENT MKLMS DEPLOYMENTS ==="
          curl -fsS "${auth[@]}" "$base/scripts/mklms/deployments" > /tmp/deployments.json
          jq -e '.success == true' /tmp/deployments.json >/dev/null
          jq -c '.result.deployments[:5][]? | {id,created_on,source,versions}' /tmp/deployments.json

          echo "=== ASSERT PRODUCTION AUTH LIMIT ==="
          jq -e 'any(.result.bindings[]?; .type == "ratelimit" and .name == "AUTH_RATE_LIMITER" and .namespace_id == "51090501" and .simple.limit == 10 and .simple.period == 60)' /tmp/settings.json >/dev/null
          echo "PRODUCTION_AUTH_RATE_LIMIT_METADATA_VERIFIED"
