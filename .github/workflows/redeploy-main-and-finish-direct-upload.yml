name: Diagnose MkLMS deployed rate limiter

on:
  push:
    branches:
      - ops/cloudflare-new-update-setup-2026-09-05
    paths:
      - .github/workflows/redeploy-main-and-finish-direct-upload.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Tail live Worker while exercising invalid claim requests
        shell: bash
        run: |
          set -u
          host=learn.starpipsforex.com
          : > /tmp/tail.log

          timeout 40s npx --yes wrangler@4.127.1 tail mklms --format=json --sampling-rate=1 > /tmp/tail.log 2>&1 &
          tail_pid=$!
          sleep 8

          for i in $(seq 1 8); do
            code=$(curl -sS -o "/tmp/claim-$i.json" -w '%{http_code}' \
              --connect-timeout 8 --max-time 15 \
              -H 'Content-Type: application/json' \
              --data '{}' \
              "https://$host/api/access/claim" || true)
            echo "CLAIM_REQUEST_$i=$code"
            sleep 1
          done

          sleep 5
          kill "$tail_pid" 2>/dev/null || true
          wait "$tail_pid" 2>/dev/null || true

          echo "=== LIVE WORKER TAIL ==="
          cat /tmp/tail.log
          echo "=== RELEVANT LIMITER LOGS ==="
          grep -Ei 'AUTH_RATE_LIMITER|distributed rate limiter|binding unavailable|student-claim|exception|error' /tmp/tail.log || true
          echo "LIVE_TAIL_DIAGNOSTIC_COMPLETE"
