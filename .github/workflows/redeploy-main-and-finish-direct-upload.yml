name: Diagnose MkLMS public hostname

on:
  push:
    branches:
      - ops/cloudflare-new-update-setup-2026-09-05
    paths:
      - .github/workflows/redeploy-main-and-finish-direct-upload.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Public DNS and HTTPS diagnostic only
        shell: bash
        run: |
          set -u
          host=learn.starpipsforex.com
          worker=mklms.dry-glitter-7e16.workers.dev
          echo "=== PUBLIC DNS VIA 1.1.1.1 ==="
          dig +short @1.1.1.1 "$host" A || true
          dig +short @1.1.1.1 "$host" AAAA || true
          dig +short @1.1.1.1 "$host" CNAME || true
          echo "=== PUBLIC DNS VIA 8.8.8.8 ==="
          dig +short @8.8.8.8 "$host" A || true
          dig +short @8.8.8.8 "$host" AAAA || true
          dig +short @8.8.8.8 "$host" CNAME || true
          echo "=== AUTHORITY ==="
          dig +short NS starpipsforex.com || true
          echo "=== HTTPS CUSTOM HOST ==="
          curl -sSIL --connect-timeout 8 --max-time 15 "https://$host/" | head -30 || true
          echo "=== HTTPS WORKERS.DEV ==="
          curl -sSIL --connect-timeout 8 --max-time 15 "https://$worker/" | head -30 || true
          echo "PUBLIC_HOSTNAME_DIAGNOSTIC_COMPLETE"
