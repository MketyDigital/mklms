name: Inspect active MkLMS production version

on:
  push:
    branches:
      - ops/cloudflare-new-update-setup-2026-09-05
    paths:
      - .github/workflows/redeploy-main-and-finish-direct-upload.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Read exact active deployed version resources
        shell: bash
        run: |
          set -euo pipefail
          auth=(-H "Authorization: Bearer $CLOUDFLARE_API_TOKEN")
          script=mklms

          curl -fsS "${auth[@]}" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$script/deployments" > /tmp/deployments.json
          jq -e '.success == true' /tmp/deployments.json >/dev/null
          active_version=$(jq -r '(.result.deployments // .result // [])[0].versions[]? | select(.percentage == 100) | .version_id' /tmp/deployments.json | head -1)
          test -n "$active_version"
          echo "ACTIVE_VERSION=$active_version"

          curl -fsS "${auth[@]}" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$script/versions/$active_version" > /tmp/version.json
          jq -e '.success == true' /tmp/version.json >/dev/null

          echo "=== ACTIVE VERSION METADATA ==="
          jq -c '.result | {id,number,metadata}' /tmp/version.json

          echo "=== ACTIVE VERSION RATE LIMIT BINDINGS ==="
          jq -c '.result.resources.bindings[]? | select(.namespace_id != null and .simple != null) | {name,namespace_id,simple}' /tmp/version.json
          count=$(jq '[.result.resources.bindings[]? | select(.namespace_id != null and .simple != null)] | length' /tmp/version.json)
          echo "ACTIVE_RATE_LIMIT_BINDING_COUNT=$count"
          test "$count" = "5"

          echo "ACTIVE_VERSION_BINDING_INSPECTION_COMPLETE"
