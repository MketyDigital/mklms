name: Diagnose MkLMS real-browser challenge

on:
  push:
    branches:
      - ops/cloudflare-new-update-setup-2026-09-05
    paths:
      - .github/workflows/redeploy-main-and-finish-direct-upload.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Test custom hostname with real headless Chrome
        shell: bash
        run: |
          set -euo pipefail
          host=https://learn.starpipsforex.com
          worker=https://mklms.dry-glitter-7e16.workers.dev
          chrome=$(command -v google-chrome || command -v google-chrome-stable || command -v chromium-browser || command -v chromium || true)
          echo "CHROME_BIN=${chrome:-none}"
          if [ -z "$chrome" ]; then
            echo "No Chrome/Chromium binary available on runner."
            exit 0
          fi

          run_browser() {
            label="$1"; url="$2"
            echo "=== $label ==="
            rm -rf /tmp/chrome-profile /tmp/chrome-dom.html
            timeout 35s "$chrome" \
              --headless=new \
              --no-sandbox \
              --disable-dev-shm-usage \
              --disable-gpu \
              --user-data-dir=/tmp/chrome-profile \
              --virtual-time-budget=20000 \
              --dump-dom "$url" > /tmp/chrome-dom.html 2>/tmp/chrome.err || true
            echo "DOM_MARKERS:"
            grep -Eio '<title>[^<]+|Just a moment|Verify you are human|challenge-platform|cf-chl|STARPIPSFOREX|MkLMS|Admin Login|Student Login' /tmp/chrome-dom.html | head -20 || true
            echo "COOKIE_FILES:"
            find /tmp/chrome-profile -type f 2>/dev/null | grep -Ei 'Cookies$' | head -5 || true
            echo "ERROR_TAIL:"
            tail -20 /tmp/chrome.err || true
          }

          run_browser 'CUSTOM HOST ROOT' "$host/"
          run_browser 'CUSTOM HOST LOGIN' "$host/login"
          run_browser 'WORKERS.DEV ROOT' "$worker/"
          echo "READ_ONLY_REAL_BROWSER_DIAGNOSTIC_COMPLETE"
