name: Diagnose MkLMS SaaS custom hostname

on:
  push:
    branches:
      - ops/cloudflare-new-update-setup-2026-09-05
    paths:
      - .github/workflows/redeploy-main-and-finish-direct-upload.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Read-only SaaS custom-hostname diagnostic
        shell: bash
        run: |
          set -euo pipefail
          auth=(-H "Authorization: Bearer $CLOUDFLARE_API_TOKEN")
          zone_name=mkety.com
          host=learn.starpipsforex.com
          zones=$(curl -fsS "${auth[@]}" "https://api.cloudflare.com/client/v4/zones?account.id=$CLOUDFLARE_ACCOUNT_ID&name=$zone_name")
          zone_id=$(printf '%s' "$zones" | jq -r '.result[0].id // empty')
          test -n "$zone_id"
          echo "ZONE=$zone_name"
          echo "=== CUSTOM HOSTNAME RECORD ==="
          curl -sS "${auth[@]}" "https://api.cloudflare.com/client/v4/zones/$zone_id/custom_hostnames?hostname=$host&per_page=50" > /tmp/custom-hostnames.json
          jq -c '.result[]? | {id,hostname,status,ssl,custom_origin_server,custom_origin_sni,created_at}' /tmp/custom-hostnames.json || true
          echo "=== FALLBACK ORIGIN ==="
          curl -sS "${auth[@]}" "https://api.cloudflare.com/client/v4/zones/$zone_id/custom_hostnames/fallback_origin" | jq -c '.' || true
          echo "=== CUSTOM HOSTNAME ERRORS ==="
          jq -c '{success,errors,messages,result_info}' /tmp/custom-hostnames.json || true
          echo "SAAS_CUSTOM_HOSTNAME_DIAGNOSTIC_COMPLETE"
