name: Verify MkLMS production auth rate limiter

on:
  push:
    branches:
      - ops/cloudflare-new-update-setup-2026-09-05
    paths:
      - .github/workflows/redeploy-main-and-finish-direct-upload.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Probe production workers.dev claim limiter with invalid code
        shell: bash
        run: |
          set -euo pipefail
          url='https://mklms.dry-glitter-7e16.workers.dev/api/access/claim'
          body='{"email":"ratelimit-production-probe@example.invalid","certificateName":"Rate Limit Probe","claimCode":"INVALID-PROBE-CODE"}'
          saw_429=0
          first_429=0
          echo "=== PRODUCTION WORKERS.DEV CLAIM RATE LIMIT PROBE ==="
          for i in $(seq 1 40); do
            headers=$(mktemp)
            response=$(mktemp)
            code=$(curl -sS -D "$headers" -o "$response" -w '%{http_code}' -X POST "$url" -H 'content-type: application/json' --data "$body")
            ray=$(awk 'BEGIN{IGNORECASE=1} /^cf-ray:/ {gsub("\r", ""); print $2}' "$headers" | tail -1)
            retry=$(awk 'BEGIN{IGNORECASE=1} /^retry-after:/ {gsub("\r", ""); print $2}' "$headers" | tail -1)
            remaining=$(awk 'BEGIN{IGNORECASE=1} /^x-ratelimit-remaining:/ {gsub("\r", ""); print $2}' "$headers" | tail -1)
            printf 'request=%02d status=%s retry_after=%s remaining=%s ray=%s\n' "$i" "$code" "${retry:-}" "${remaining:-}" "${ray:-none}"
            if [ "$code" = "429" ] && [ "$saw_429" = "0" ]; then
              saw_429=1
              first_429=$i
            fi
            rm -f "$headers" "$response"
            sleep 0.5
          done
          echo "SAW_429=$saw_429"
          echo "FIRST_429_AT=$first_429"
          test "$saw_429" = "1"
          echo "PRODUCTION_AUTH_RATE_LIMIT_VERIFIED"
