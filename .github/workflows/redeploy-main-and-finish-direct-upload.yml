name: Inspect exact MkLMS preview ratelimit metadata

on:
  push:
    branches:
      - ops/cloudflare-new-update-setup-2026-09-05
    paths:
      - .github/workflows/redeploy-main-and-finish-direct-upload.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Read preview version resources from Cloudflare audit
        shell: bash
        run: |
          set -euo pipefail
          auth=(-H "Authorization: Bearer $CLOUDFLARE_API_TOKEN")

          curl -fsS "${auth[@]}" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/logs/audit?since=2026-09-05T19:48:00Z&before=2026-09-05T19:51:30Z&limit=200" \
            > /tmp/audit.json
          jq -e '.success == true' /tmp/audit.json >/dev/null

          echo "=== MKLMS VERSION UPLOADS 19:48-19:51 UTC ==="
          jq -c '.result[]? | select((.raw.uri // "") | contains("/workers/scripts/mklms/versions")) | {
            time:.action.time,
            version_id:.resource.response.id,
            number:.resource.response.number,
            source:.resource.response.metadata.source,
            rate_limits:[.resource.response.resources.bindings[]? | select(.namespace_id != null and .simple != null) | {name,namespace_id,simple}]
          }' /tmp/audit.json

          echo "=== PREVIEW AUTH RATE LIMIT ASSERTION ==="
          matching=$(jq -c '[.result[]? | select((.raw.uri // "") | contains("/workers/scripts/mklms/versions")) | select(.action.time >= "2026-09-05T19:49:30Z" and .action.time <= "2026-09-05T19:51:10Z") | {time:.action.time,id:.resource.response.id,bindings:[.resource.response.resources.bindings[]? | select(.name == "AUTH_RATE_LIMITER") | {name,namespace_id,simple}]}]' /tmp/audit.json)
          echo "$matching"
          jq -e 'any(.[]; any(.bindings[]?; .name == "AUTH_RATE_LIMITER" and .namespace_id == "51090501" and .simple.limit == 10 and .simple.period == 60))' <<< "$matching" >/dev/null
          echo "PREVIEW_AUTH_RATE_LIMIT_METADATA_VERIFIED"
