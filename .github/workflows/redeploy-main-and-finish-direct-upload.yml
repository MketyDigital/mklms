name: Verify MkLMS exact preview diagnostic route

on:
  push:
    branches:
      - ops/cloudflare-new-update-setup-2026-09-05
    paths:
      - .github/workflows/redeploy-main-and-finish-direct-upload.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Assert exact commit preview diagnostic response
        shell: bash
        run: |
          set -euo pipefail
          url='https://69890a6d-mklms.dry-glitter-7e16.workers.dev/api/_diagnostics/rate-limit'
          headers=$(mktemp)
          body=$(mktemp)
          code=$(curl -sS -D "$headers" -o "$body" -w '%{http_code}' "$url")
          content_type=$(awk 'BEGIN{IGNORECASE=1} /^content-type:/ {sub(/^content-type:[[:space:]]*/, ""); gsub("\r", ""); print}' "$headers" | tail -1)
          echo "STATUS=$code"
          echo "CONTENT_TYPE=$content_type"
          echo -n "BODY_PREFIX="
          head -c 500 "$body" | tr '\n' ' '
          echo
          if [ "$code" != "200" ]; then
            echo "DIAGNOSTIC_ROUTE_NOT_AVAILABLE"
            exit 2
          fi
          jq -e '.contextAvailable != null' "$body" >/dev/null
          echo "DIAGNOSTIC_JSON=$(jq -c . "$body")"
          echo "EXACT_PREVIEW_DIAGNOSTIC_VERIFIED"
