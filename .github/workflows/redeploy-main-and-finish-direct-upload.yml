name: Diagnose MkLMS Cloudflare challenge layers

on:
  push:
    branches:
      - ops/cloudflare-new-update-setup-2026-09-05
    paths:
      - .github/workflows/redeploy-main-and-finish-direct-upload.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Read-only challenge layer inspection
        shell: bash
        run: |
          set -euo pipefail
          auth=(-H "Authorization: Bearer $CLOUDFLARE_API_TOKEN")
          zone_name=mkety.com
          host=learn.starpipsforex.com
          zones=$(curl -fsS "${auth[@]}" "https://api.cloudflare.com/client/v4/zones?account.id=$CLOUDFLARE_ACCOUNT_ID&name=$zone_name")
          zone_id=$(printf '%s' "$zones" | jq -r '.result[0].id // empty')
          test -n "$zone_id"
          echo "ZONE_ID=$zone_id"

          echo "=== PUBLIC DNS ==="
          dig +short CNAME "$host" || true
          dig +short A "$host" || true
          dig +short AAAA "$host" || true

          echo "=== CURRENT RESPONSE ==="
          curl -sS -D /tmp/headers.txt -o /tmp/body.html --connect-timeout 8 --max-time 15 "https://$host/" || true
          grep -Ei '^(HTTP/|cf-|server:|content-type:|set-cookie:|location:)' /tmp/headers.txt || true
          echo "BODY_TITLE=$(grep -oPm1 '(?<=<title>)[^<]+' /tmp/body.html || true)"

          echo "=== ZONE SETTINGS ==="
          for setting in security_level browser_check challenge_ttl privacy_pass origin_error_page_pass_thru always_use_https min_tls_version opportunistic_encryption tls_1_3; do
            printf '%s=' "$setting"
            curl -sS "${auth[@]}" "https://api.cloudflare.com/client/v4/zones/$zone_id/settings/$setting" | jq -c '{success,result:{id:.result.id,value:.result.value,modified_on:.result.modified_on},errors}' || true
          done

          echo "=== BOT MANAGEMENT ==="
          curl -sS "${auth[@]}" "https://api.cloudflare.com/client/v4/zones/$zone_id/bot_management" | jq -c '{success,result,errors}' || true

          echo "=== ZONE RULESETS ==="
          curl -sS "${auth[@]}" "https://api.cloudflare.com/client/v4/zones/$zone_id/rulesets" > /tmp/zrules.json || true
          jq -c '{success,errors}' /tmp/zrules.json || true
          jq -c '.result[]? | {id,name,kind,phase,version,last_updated}' /tmp/zrules.json || true
          for id in $(jq -r '.result[]?.id' /tmp/zrules.json 2>/dev/null); do
            curl -sS "${auth[@]}" "https://api.cloudflare.com/client/v4/zones/$zone_id/rulesets/$id" | jq -c '.result | {id,name,kind,phase,rules:[.rules[]? | {id,version,action,expression,description,enabled,action_parameters,ratelimit,logging}]}' || true
          done

          echo "=== ACCOUNT RULESETS ==="
          curl -sS "${auth[@]}" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/rulesets" > /tmp/arules.json || true
          jq -c '{success,errors}' /tmp/arules.json || true
          jq -c '.result[]? | {id,name,kind,phase,version,last_updated}' /tmp/arules.json || true

          echo "=== CUSTOM HOSTNAME ==="
          curl -sS "${auth[@]}" "https://api.cloudflare.com/client/v4/zones/$zone_id/custom_hostnames?hostname=$host" | jq -c '{success,errors,result:[.result[]? | {id,hostname,status,ssl,custom_origin_server,custom_metadata}]}' || true

          echo "READ_ONLY_CHALLENGE_LAYER_INSPECTION_COMPLETE"
