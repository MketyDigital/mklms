name: Probe exact MkLMS limiter binding state

on:
  push:
    branches:
      - ops/cloudflare-new-update-setup-2026-09-05
    paths:
      - .github/workflows/redeploy-main-and-finish-direct-upload.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Call exact commit preview binding probe
        shell: bash
        run: |
          set -euo pipefail
          url='https://c436c8e4-mklms.dry-glitter-7e16.workers.dev/api/debug-rate-limit-probe'
          echo "=== EXACT PREVIEW DIRECT BINDING PROBE ==="
          saw_false=0
          for i in $(seq 1 15); do
            body=$(mktemp)
            code=$(curl -sS -o "$body" -w '%{http_code}' "$url")
            printf 'probe=%02d status=%s response=' "$i" "$code"
            head -c 500 "$body" | tr '\n' ' '
            echo
            test "$code" = "200"
            jq -e '.contextAvailable != null' "$body" >/dev/null
            if [ "$(jq -r '.success // empty' "$body")" = "false" ]; then saw_false=1; fi
            rm -f "$body"
          done
          echo "SAW_SUCCESS_FALSE=$saw_false"
          echo "EXACT_PREVIEW_BINDING_PROBE_COMPLETE"
