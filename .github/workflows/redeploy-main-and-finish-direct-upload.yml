name: Confirm MkLMS direct limiter false responses

on:
  push:
    branches:
      - ops/cloudflare-new-update-setup-2026-09-05
    paths:
      - .github/workflows/redeploy-main-and-finish-direct-upload.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Read raw direct binding responses without false coalescing
        shell: bash
        run: |
          set -euo pipefail
          url='https://fix-rate-limit-runtime-diagnostics-2026-09-05-mklms.dry-glitter-7e16.workers.dev/api/debug-rate-limit-probe'
          saw_false=0
          first_false=0
          echo "=== RAW DIRECT LIMITER RESPONSES ==="
          for i in $(seq 1 40); do
            headers=$(mktemp)
            body=$(mktemp)
            code=$(curl -sS -D "$headers" -o "$body" -w '%{http_code}' "$url")
            ray=$(awk 'BEGIN{IGNORECASE=1} /^cf-ray:/ {gsub("\r", ""); print $2}' "$headers" | tail -1)
            json=$(cat "$body")
            printf 'probe=%02d status=%s ray=%s response=%s\n' "$i" "$code" "${ray:-none}" "$json"
            test "$code" = "200"
            if jq -e 'has("success") and .success == false' "$body" >/dev/null; then
              if [ "$saw_false" = "0" ]; then first_false=$i; fi
              saw_false=1
            fi
            rm -f "$headers" "$body"
            sleep 0.5
          done
          echo "SAW_SUCCESS_FALSE=$saw_false"
          echo "FIRST_FALSE_AT=$first_false"
          test "$saw_false" = "1"
          echo "DIRECT_LIMITER_FALSE_CONFIRMED"
