name: Verify merged MkLMS security deployment

on:
  push:
    branches:
      - ops/cloudflare-new-update-setup-2026-09-05
    paths:
      - .github/workflows/redeploy-main-and-finish-direct-upload.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Verify active production version and live endpoints
        shell: bash
        run: |
          set -euo pipefail
          auth=(-H "Authorization: Bearer $CLOUDFLARE_API_TOKEN")
          base="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers"

          echo "=== CURRENT PRODUCTION DEPLOYMENT ==="
          curl -fsS "${auth[@]}" "$base/scripts/mklms/deployments" > /tmp/deployments.json
          jq -e '.success == true' /tmp/deployments.json >/dev/null
          latest=$(jq -c '.result.deployments[0] | {id,created_on,source,versions}' /tmp/deployments.json)
          echo "$latest"
          version=$(jq -r '.result.deployments[0].versions[0].version_id' /tmp/deployments.json)
          test -n "$version"

          echo "=== ACTIVE VERSION RATE LIMIT BINDINGS ==="
          curl -fsS "${auth[@]}" "$base/scripts/mklms/versions/$version" > /tmp/version.json
          jq -e '.success == true' /tmp/version.json >/dev/null
          jq -c '[.result.resources.bindings[]? | select(.name | endswith("_RATE_LIMITER")) | {name,type,namespace_id,simple}]' /tmp/version.json
          jq -e 'any(.result.resources.bindings[]?; .name == "AUTH_RATE_LIMITER" and .type == "ratelimit" and .simple.limit == 10 and .simple.period == 60)' /tmp/version.json >/dev/null

          echo "=== LIVE HTTP CHECKS ==="
          check() {
            label="$1"; url="$2"; expected="$3"
            headers=$(mktemp); body=$(mktemp)
            code=$(curl -sS -D "$headers" -o "$body" -w '%{http_code}' "$url")
            ray=$(awk 'BEGIN{IGNORECASE=1} /^cf-ray:/ {gsub("\r", ""); print $2}' "$headers" | tail -1)
            mitigated=$(awk 'BEGIN{IGNORECASE=1} /^cf-mitigated:/ {gsub("\r", ""); print $2}' "$headers" | tail -1)
            printf '%s status=%s cf_mitigated=%s ray=%s\n' "$label" "$code" "${mitigated:-}" "${ray:-none}"
            test "$code" = "$expected"
            rm -f "$headers" "$body"
          }
          check root 'https://learn.starpipsforex.com/' 200
          check login 'https://learn.starpipsforex.com/login' 200
          check admin_login 'https://learn.starpipsforex.com/admin-login' 200
          check exploit_probe 'https://learn.starpipsforex.com/.env' 403
          check workers_root 'https://mklms.dry-glitter-7e16.workers.dev/' 200

          echo "=== SMALL INVALID CLAIM SAMPLE ==="
          for i in 1 2 3; do
            headers=$(mktemp); body=$(mktemp)
            code=$(curl -sS -D "$headers" -o "$body" -w '%{http_code}' -X POST 'https://learn.starpipsforex.com/api/access/claim' -H 'content-type: application/json' --data '{}')
            ray=$(awk 'BEGIN{IGNORECASE=1} /^cf-ray:/ {gsub("\r", ""); print $2}' "$headers" | tail -1)
            printf 'claim_probe=%s status=%s ray=%s\n' "$i" "$code" "${ray:-none}"
            case "$code" in 400|403|429) ;; *) echo "unexpected claim status $code"; exit 1;; esac
            rm -f "$headers" "$body"
            sleep 1
          done

          echo "MERGED_SECURITY_LIVE_VERIFICATION_COMPLETE"
