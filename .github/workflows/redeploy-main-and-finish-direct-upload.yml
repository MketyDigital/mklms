name: Probe MkLMS preview rate limit binding directly

on:
  push:
    branches:
      - ops/cloudflare-new-update-setup-2026-09-05
    paths:
      - .github/workflows/redeploy-main-and-finish-direct-upload.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Call isolated diagnostic endpoint repeatedly
        shell: bash
        run: |
          set -euo pipefail
          url='https://fix-rate-limit-runtime-diagnostics-2026-09-05-mklms.dry-glitter-7e16.workers.dev/api/_diagnostics/rate-limit'

          echo "=== DIRECT RATE LIMIT BINDING PROBE ==="
          for i in $(seq 1 15); do
            printf 'probe=%02d response=' "$i"
            curl -sS "$url"
            echo
          done
          echo "DIRECT_RATE_LIMIT_BINDING_PROBE_COMPLETE"
