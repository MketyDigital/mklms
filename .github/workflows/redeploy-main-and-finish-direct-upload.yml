name: Trace MkLMS rate limit binding removal

on:
  push:
    branches:
      - ops/cloudflare-new-update-setup-2026-09-05
    paths:
      - .github/workflows/redeploy-main-and-finish-direct-upload.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Read Cloudflare audit around binding disappearance
        shell: bash
        run: |
          set -euo pipefail
          auth=(-H "Authorization: Bearer $CLOUDFLARE_API_TOKEN")
          since='2026-09-05T19:15:00Z'
          before='2026-09-05T19:30:00Z'

          curl -fsS "${auth[@]}" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/logs/audit?since=$since&before=$before&limit=200" \
            > /tmp/audit.json
          jq -e '.success == true' /tmp/audit.json >/dev/null

          echo "=== MKLMS WORKER AUDIT 19:15-19:30 UTC ==="
          jq -c '.result[]? | select(
            ((.raw.uri // "") | contains("/workers/scripts/mklms")) or
            ((.resource.type // "") | startswith("scripts"))
          ) | {
            time:.action.time,
            description:.action.description,
            type:.action.type,
            result:.action.result,
            actor:{type:.actor.type,email:.actor.email,context:.actor.context,token_name:.actor.token_name},
            raw:{method:.raw.method,status_code:.raw.status_code,uri:.raw.uri},
            resource:{type:.resource.type,product:.resource.product,request:.resource.request,response:.resource.response}
          }' /tmp/audit.json

          echo "=== ALL AUDIT ACTIONS IN WINDOW ==="
          jq -c '.result[]? | {time:.action.time,description:.action.description,type:.action.type,result:.action.result,actor:{type:.actor.type,email:.actor.email,context:.actor.context},raw:{method:.raw.method,status_code:.raw.status_code,uri:.raw.uri},resource_type:.resource.type}' /tmp/audit.json

          echo "AUDIT_BINDING_REMOVAL_TRACE_COMPLETE"
