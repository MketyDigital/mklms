name: Diagnose MkLMS Cloudflare audit history

on:
  push:
    branches:
      - ops/cloudflare-new-update-setup-2026-09-05
    paths:
      - .github/workflows/redeploy-main-and-finish-direct-upload.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Read-only Cloudflare audit history
        shell: bash
        run: |
          set -euo pipefail
          auth=(-H "Authorization: Bearer $CLOUDFLARE_API_TOKEN")
          echo "=== AUDIT LOGS V2 SINCE 2026-08-30 ==="
          curl -sS "${auth[@]}" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/logs/audit?since=2026-08-30T00:00:00Z&before=2026-09-06T00:00:00Z&limit=200" > /tmp/audit.json || true
          jq -c '{success,errors,messages,result_info}' /tmp/audit.json 2>/dev/null || cat /tmp/audit.json
          echo "=== RELEVANT CHANGES ==="
          jq -c '.result[]? | select(
            ((.zone.name // "") == "mkety.com") or
            ((.raw.uri // "") | test("workers|custom_hostnames|settings|rulesets|firewall|security"; "i")) or
            ((.action.description // "") | test("worker|hostname|security|browser|firewall|rule|setting|route"; "i"))
          ) | {time:.action.time,description:.action.description,type:.action.type,result:.action.result,actor:{type:.actor.type,email:.actor.email,context:.actor.context,token_name:.actor.token_name},zone:.zone.name,raw:{method:.raw.method,status_code:.raw.status_code,uri:.raw.uri},resource:{type:.resource.type,product:.resource.product,request:.resource.request,response:.resource.response}}' /tmp/audit.json 2>/dev/null | head -200 || true
          echo "READ_ONLY_AUDIT_DIAGNOSTIC_COMPLETE"
