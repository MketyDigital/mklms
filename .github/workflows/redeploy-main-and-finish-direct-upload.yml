name: Inventory MkLMS SaaS WAF coverage

on:
  push:
    branches:
      - ops/cloudflare-new-update-setup-2026-09-05
    paths:
      - .github/workflows/redeploy-main-and-finish-direct-upload.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Read-only inventory SaaS custom hostnames and shared WAF
        shell: bash
        run: |
          set -euo pipefail
          auth=(-H "Authorization: Bearer $CLOUDFLARE_API_TOKEN")
          zone_name=mkety.com
          description='Mkety block impossible exploit probes'

          zones=$(curl -fsS "${auth[@]}" "https://api.cloudflare.com/client/v4/zones?account.id=$CLOUDFLARE_ACCOUNT_ID&name=$zone_name")
          zone_id=$(printf '%s' "$zones" | jq -r '.result[0].id // empty')
          test -n "$zone_id"

          echo "=== SHARED CUSTOM WAF RULE ==="
          curl -fsS "${auth[@]}" "https://api.cloudflare.com/client/v4/zones/$zone_id/rulesets/phases/http_request_firewall_custom/entrypoint" > /tmp/rules.json
          jq -e --arg d "$description" '.success == true and any(.result.rules[]?; .description == $d and .action == "block" and .enabled == true)' /tmp/rules.json >/dev/null
          jq -c --arg d "$description" '.result.rules[]? | select(.description == $d) | {id,description,action,expression,enabled,last_updated}' /tmp/rules.json

          echo "=== CURRENT CLOUDFLARE FOR SAAS CUSTOM HOSTNAMES ==="
          curl -fsS "${auth[@]}" "https://api.cloudflare.com/client/v4/zones/$zone_id/custom_hostnames?per_page=50&page=1" > /tmp/hosts.json
          jq -e '.success == true' /tmp/hosts.json >/dev/null
          jq -c '.result[]? | {id,hostname,status,ssl_status:.ssl.status,custom_origin_server,custom_metadata}' /tmp/hosts.json
          echo "CUSTOM_HOSTNAME_COUNT=$(jq '.result | length' /tmp/hosts.json)"

          echo "=== SAFE HTTP CHECKS FOR EACH ACTIVE HOSTNAME ==="
          jq -r '.result[]? | select(.status == "active") | .hostname' /tmp/hosts.json | while read -r host; do
            [ -n "$host" ] || continue
            root_code=$(curl -sS -o /tmp/root.html -w '%{http_code}' --connect-timeout 8 --max-time 15 "https://$host/" || true)
            probe_code=$(curl -sS -o /tmp/probe.html -w '%{http_code}' --connect-timeout 8 --max-time 15 "https://$host/.env" || true)
            echo "HOST=$host ROOT_HTTP=$root_code PROBE_ENV_HTTP=$probe_code"
          done

          echo "READ_ONLY_SAAS_WAF_INVENTORY_COMPLETE"
