name: Cloudflare SaaS audit once

on:
  push:
    branches:
      - ops/cloudflare-saas-audit

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      MKLMS_ADMIN_ACCESS_KEY: ${{ secrets.MKLMS_ADMIN_ACCESS_KEY }}
      MKLMS_ADMIN_SESSION_SECRET: ${{ secrets.MKLMS_ADMIN_SESSION_SECRET }}
      MKLMS_MEDIA_SIGNING_SECRET: ${{ secrets.MKLMS_MEDIA_SIGNING_SECRET }}
    steps:
      - name: Verify standardized Starpips release secret names
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          for name in MKLMS_ADMIN_ACCESS_KEY MKLMS_ADMIN_SESSION_SECRET MKLMS_MEDIA_SIGNING_SECRET; do
            if [ -n "${!name:-}" ]; then echo "$name: configured"; else echo "$name: missing"; fi
          done
