name: Read-only D1 schema inventory

on:
  workflow_dispatch:
    inputs:
      installation:
        description: Installation whose D1 databases should be inspected
        required: true
        type: choice
        options:
          - starpips
          - mkety-academy

permissions:
  contents: read

concurrency:
  group: d1-live-schema-readonly-${{ inputs.installation }}
  cancel-in-progress: false

jobs:
  inventory:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      INSTALLATION_ID: ${{ inputs.installation }}
      D1_SCHEMA_REPORT_PATH: d1-live-schema-${{ inputs.installation }}.json
    steps:
      - name: Checkout selected ref
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Verify required Cloudflare secrets are present
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Missing CLOUDFLARE_ACCOUNT_ID"; exit 1; }
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing CLOUDFLARE_API_TOKEN"; exit 1; }

      - name: Read D1 database names and matching SQLite catalogs
        run: node scripts/cloudflare-d1-live-inventory.mjs

      - name: Upload schema-only inventory
        uses: actions/upload-artifact@v4
        with:
          name: d1-live-schema-${{ inputs.installation }}
          path: d1-live-schema-${{ inputs.installation }}.json
          if-no-files-found: error
          retention-days: 3
