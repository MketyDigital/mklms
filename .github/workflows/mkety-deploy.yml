name: Validate or Deploy Mkety Academy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Preview performs full non-mutating validation; production deploys only from production/mkety-academy.
        required: true
        type: choice
        options:
          - preview
          - production
        default: preview

permissions:
  contents: read

env:
  INSTALLATION_ID: mkety-academy
  PRODUCTION_BRANCH: production/mkety-academy
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DEPLOY_API_TOKEN }}
  MKETY_ADMIN_ACCESS_KEY: ${{ secrets.MKETY_ADMIN_ACCESS_KEY }}
  MKETY_ADMIN_SESSION_SECRET: ${{ secrets.MKETY_ADMIN_SESSION_SECRET }}
  MKETY_MEDIA_SIGNING_SECRET: ${{ secrets.MKETY_MEDIA_SIGNING_SECRET }}
  MKETY_MEDIA_DELIVERY_BASE_URL: ${{ secrets.MKETY_MEDIA_DELIVERY_BASE_URL }}
  MKETY_R2_ACCESS_KEY_ID: ${{ secrets.MKETY_R2_ACCESS_KEY_ID }}
  MKETY_R2_SECRET_ACCESS_KEY: ${{ secrets.MKETY_R2_SECRET_ACCESS_KEY }}
  MKETY_BILLING_SERVICE_URL: ${{ secrets.MKETY_BILLING_SERVICE_URL }}
  MKETY_BILLING_SHARED_SECRET: ${{ secrets.MKETY_BILLING_SHARED_SECRET }}

jobs:
  validate-or-deploy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Enforce Mkety-only release target
        shell: bash
        run: |
          set -euo pipefail
          test "$INSTALLATION_ID" = "mkety-academy"
          test "$PRODUCTION_BRANCH" = "production/mkety-academy"
          test "$INSTALLATION_ID" != "starpips"
          test "$PRODUCTION_BRANCH" != "production/starpips"
          test ! -e deploy/installations/starpips.json || grep -q 'spf-media' deploy/installations/starpips.json
          if [ "${{ inputs.environment }}" = "production" ]; then
            test "$GITHUB_REF" = "refs/heads/${PRODUCTION_BRANCH}" || {
              echo "Production deployment is allowed only from production/mkety-academy."
              exit 1
            }
          fi

      - name: Require reviewed concrete Mkety manifest
        shell: bash
        run: |
          set -euo pipefail
          test -f deploy/installations/mkety-academy.json || {
            echo "Missing reviewed deploy/installations/mkety-academy.json. Provision and review the proposed manifest first."
            exit 1
          }
          test "$(jq -r '.id' deploy/installations/mkety-academy.json)" = "mkety-academy"
          test "$(jq -r '.deployable' deploy/installations/mkety-academy.json)" = "true"
          test "$(jq -r '.productionBranch' deploy/installations/mkety-academy.json)" = "production/mkety-academy"
          test "$(jq -r '.appWorker' deploy/installations/mkety-academy.json)" != "mklms"
          test "$(jq -r '.mediaWorker' deploy/installations/mkety-academy.json)" != "mklms-media-delivery"
          test "$(jq -r '.r2Bucket' deploy/installations/mkety-academy.json)" != "spf-media"

      - name: Install dependencies
        run: npm ci

      - name: Validate installation manifests
        run: npm run installation:validate

      - name: Generate Mkety Wrangler configs
        run: npm run installation:generate -- mkety-academy

      - name: Domain tests
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Cloudflare OpenNext build
        run: npm run cf:build

      - name: Mkety application Worker packaging dry run
        run: >-
          npx wrangler deploy
          --config .generated/mkety-academy/app.wrangler.jsonc
          --dry-run
          --experimental-provision=false
          --experimental-auto-create=false

      - name: Mkety media Worker packaging dry run
        run: >-
          npx wrangler deploy
          --config .generated/mkety-academy/media.wrangler.jsonc
          --dry-run
          --experimental-provision=false
          --experimental-auto-create=false

      - name: Preview validation complete
        if: ${{ inputs.environment == 'preview' }}
        run: echo "Mkety preview validation completed without Cloudflare deployment writes."

      - name: Verify Mkety deployment credentials
        if: ${{ inputs.environment == 'production' }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Missing CLOUDFLARE_ACCOUNT_ID."; exit 1; }
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing CLOUDFLARE_DEPLOY_API_TOKEN."; exit 1; }
          test -n "$MKETY_ADMIN_ACCESS_KEY" || { echo "Missing MKETY_ADMIN_ACCESS_KEY."; exit 1; }
          test -n "$MKETY_ADMIN_SESSION_SECRET" || { echo "Missing MKETY_ADMIN_SESSION_SECRET."; exit 1; }
          test -n "$MKETY_MEDIA_SIGNING_SECRET" || { echo "Missing MKETY_MEDIA_SIGNING_SECRET."; exit 1; }
          test -n "$MKETY_MEDIA_DELIVERY_BASE_URL" || { echo "Missing MKETY_MEDIA_DELIVERY_BASE_URL."; exit 1; }
          test -n "$MKETY_R2_ACCESS_KEY_ID" || { echo "Missing bucket-scoped MKETY_R2_ACCESS_KEY_ID."; exit 1; }
          test -n "$MKETY_R2_SECRET_ACCESS_KEY" || { echo "Missing bucket-scoped MKETY_R2_SECRET_ACCESS_KEY."; exit 1; }

      - name: Build temporary Mkety secret files
        if: ${{ inputs.environment == 'production' }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .deployment-secrets
          chmod 700 .deployment-secrets
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          const manifest = JSON.parse(readFileSync('deploy/installations/mkety-academy.json', 'utf8'));
          const endpoint = `https://${process.env.CLOUDFLARE_ACCOUNT_ID}.r2.cloudflarestorage.com`;
          const app = {
            MKLMS_ADMIN_ACCESS_KEY: process.env.MKETY_ADMIN_ACCESS_KEY,
            MKLMS_ADMIN_SESSION_SECRET: process.env.MKETY_ADMIN_SESSION_SECRET,
            MKLMS_MEDIA_SIGNING_SECRET: process.env.MKETY_MEDIA_SIGNING_SECRET,
            MKLMS_MEDIA_DELIVERY_BASE_URL: process.env.MKETY_MEDIA_DELIVERY_BASE_URL,
            MKLMS_BILLING_INSTALLATION_ID: 'mkety-academy',
            R2_ACCOUNT_ID: process.env.CLOUDFLARE_ACCOUNT_ID,
            MKLMS_R2_DIRECT_UPLOAD_BUCKET: manifest.r2Bucket,
            MKLMS_R2_DIRECT_UPLOAD_ENDPOINT: endpoint,
            MKLMS_R2_DIRECT_UPLOAD_ACCESS_KEY_ID: process.env.MKETY_R2_ACCESS_KEY_ID,
            MKLMS_R2_DIRECT_UPLOAD_SECRET_ACCESS_KEY: process.env.MKETY_R2_SECRET_ACCESS_KEY,
          };
          if (process.env.MKETY_BILLING_SERVICE_URL) app.MKLMS_BILLING_SERVICE_URL = process.env.MKETY_BILLING_SERVICE_URL;
          if (process.env.MKETY_BILLING_SHARED_SECRET) app.MKLMS_BILLING_SHARED_SECRET = process.env.MKETY_BILLING_SHARED_SECRET;
          writeFileSync('.deployment-secrets/app.json', JSON.stringify(app), { mode: 0o600 });
          writeFileSync(
            '.deployment-secrets/media.json',
            JSON.stringify({
              MKLMS_MEDIA_SIGNING_SECRET: process.env.MKETY_MEDIA_SIGNING_SECRET,
              MKLMS_MEDIA_ALLOWED_ORIGINS: `https://${manifest.publicDomain}`,
            }),
            { mode: 0o600 },
          );
          NODE

      - name: Deploy Mkety protected media Worker
        if: ${{ inputs.environment == 'production' }}
        run: >-
          npx wrangler deploy
          --config .generated/mkety-academy/media.wrangler.jsonc
          --secrets-file .deployment-secrets/media.json
          --experimental-provision=false
          --experimental-auto-create=false

      - name: Deploy Mkety application Worker
        if: ${{ inputs.environment == 'production' }}
        run: >-
          npx wrangler deploy
          --config .generated/mkety-academy/app.wrangler.jsonc
          --secrets-file .deployment-secrets/app.json
          --experimental-provision=false
          --experimental-auto-create=false

      - name: Remove temporary secret files
        if: ${{ always() }}
        shell: bash
        run: rm -rf .deployment-secrets
