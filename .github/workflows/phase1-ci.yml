name: MkLMS CI

on:
  pull_request:
    branches:
      - main
      - architecture/mklms-reusable-platform
      - feature/mklms-phase-1-foundation-access
      - feature/mklms-phase-2-learning-progress
      - feature/mklms-phase-3-certificates-media
      - feature/mklms-phase-4-live-classes
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Upload regenerated lockfile
        uses: actions/upload-artifact@v4
        with:
          name: package-lock
          path: package-lock.json
          retention-days: 3

      - name: Domain tests
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Build
        env:
          DATABASE_URL: postgresql://user:pass@127.0.0.1:5432/mklms
          MKLMS_ADMIN_ACCESS_KEY: ci-admin-key
          MKLMS_ADMIN_SESSION_SECRET: ci-admin-session-secret
        run: npm run build
