name: MkLMS CI

on:
  pull_request:
    branches:
      - main
      - architecture/mklms-reusable-platform
      - feature/mklms-phase-1-foundation-access
      - feature/mklms-phase-2-learning-progress
      - feature/mklms-phase-3-certificates-media
      - feature/mklms-phase-4-live-classes
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mklms-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Upload regenerated lockfile
        uses: actions/upload-artifact@v4
        with:
          name: package-lock
          path: package-lock.json
          retention-days: 3

      - name: Domain tests
        run: npm test

      - name: Verify PostgreSQL to D1 column coverage
        run: node scripts/d1-column-parity.mjs --require-complete

      - name: Verify PostgreSQL to D1 schema coverage
        run: node scripts/d1-schema-coverage.mjs --require-complete

      - name: Rehearse all D1 migrations and integrity checks
        run: node scripts/d1-rehearse-migrations.mjs

      - name: Reject active Supabase references
        run: node scripts/audit-no-supabase.mjs --strict

      - name: Lint
        run: npm run lint

      - name: Next.js production build
        env:
          DATABASE_URL: postgresql://user:pass@127.0.0.1:5432/mklms
          MKLMS_ADMIN_ACCESS_KEY: ci-admin-key
          MKLMS_ADMIN_SESSION_SECRET: ci-admin-session-secret
        run: npm run build

      - name: Cloudflare OpenNext build
        env:
          DATABASE_URL: postgresql://user:pass@127.0.0.1:5432/mklms
          MKLMS_ADMIN_ACCESS_KEY: ci-admin-key
          MKLMS_ADMIN_SESSION_SECRET: ci-admin-session-secret
        run: npm run cf:build

      - name: Cloudflare Worker packaging dry run
        env:
          DATABASE_URL: postgresql://user:pass@127.0.0.1:5432/mklms
          MKLMS_ADMIN_ACCESS_KEY: ci-admin-key
          MKLMS_ADMIN_SESSION_SECRET: ci-admin-session-secret
        run: npx wrangler deploy --dry-run --outdir .wrangler-dry-run

      - name: Protected media Worker packaging dry run
        run: npx wrangler deploy --dry-run --config workers/media-delivery/wrangler.jsonc --outdir .media-worker-dry-run

      - name: External billing Worker packaging dry run
        run: npx wrangler deploy --dry-run --config workers/billing/wrangler.jsonc --outdir .billing-worker-dry-run

  live-readonly-schema-audit:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.number == 149 &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Read staging PostgreSQL catalog
        env:
          MKLMS_SCHEMA_AUDIT_DATABASE_URL: ${{ secrets.MKLMS_PG_STAGING_DATABASE_URL }}
        run: |
          set -euo pipefail
          test -n "$MKLMS_SCHEMA_AUDIT_DATABASE_URL" || { echo "Missing MKLMS_PG_STAGING_DATABASE_URL"; exit 1; }
          mkdir -p schema-audit-output
          node scripts/export-postgres-schema-catalog.mjs schema-audit-output/postgres-staging.json

      - name: Read exact-match D1 catalogs for both installations
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Missing CLOUDFLARE_ACCOUNT_ID"; exit 1; }
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing CLOUDFLARE_API_TOKEN"; exit 1; }
          for installation in starpips mkety-academy; do
            INSTALLATION_ID="$installation" \
            D1_SCHEMA_REPORT_PATH="schema-audit-output/d1-${installation}.json" \
              node scripts/cloudflare-d1-live-inventory.mjs
          done

      - name: Upload schema-only audit snapshots
        uses: actions/upload-artifact@v4
        with:
          name: mklms-live-schema-audit-pr-149
          path: schema-audit-output/*.json
          if-no-files-found: error
          retention-days: 3
