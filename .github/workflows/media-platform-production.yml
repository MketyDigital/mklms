# deploy Cloudflare-compatible password KDF buffer fix
name: Deploy Mkety Media production

on:
  push:
    branches:
      - media-platform
    paths:
      - ".github/workflows/media-platform-production.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mkety-media-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: media-platform
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      MEDIA_OPERATOR_ACCESS_KEY: ${{ secrets.MEDIA_OPERATOR_ACCESS_KEY || secrets.MKETY_ADMIN_ACCESS_KEY }}
      MEDIA_OPERATOR_SESSION_SECRET: ${{ secrets.MEDIA_OPERATOR_SESSION_SECRET || secrets.MKETY_ADMIN_SESSION_SECRET }}
      NOWPAYMENTS_API_KEY: ${{ secrets.NOWPAYMENTS_API_KEY }}
      NOWPAYMENTS_IPN_SECRET: ${{ secrets.NOWPAYMENTS_IPN_SECRET }}
      MEDIA_TELEGRAM_BOT_TOKEN: ${{ secrets.MEDIA_TELEGRAM_BOT_TOKEN || secrets.TELEGRAM_BOT_TOKEN }}
      MEDIA_TELEGRAM_CHAT_ID: ${{ secrets.MEDIA_TELEGRAM_CHAT_ID || secrets.TELEGRAM_CHAT_ID }}
      MEDIA_TELEGRAM_OPERATOR_IDS: ${{ secrets.MEDIA_TELEGRAM_OPERATOR_IDS }}
      D1_NAME: mkety-media
      KV_TITLE: mkety-media-directory
      R2_BUCKET: mkety-media-storage
      PORTAL_WORKER: mkety-media
      ASSETS_WORKER: mkety-media-assets
      MAINTENANCE_WORKER: mkety-media-maintenance
    steps:
      - name: Checkout media-platform
        uses: actions/checkout@v4
        with:
          ref: media-platform

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Record source revision
        run: echo "Deploying Mkety Media from $(git rev-parse HEAD)"

      - name: Verify required production secrets
        shell: bash
        run: |
          set -euo pipefail
          for name in CLOUDFLARE_ACCOUNT_ID CLOUDFLARE_API_TOKEN MEDIA_OPERATOR_ACCESS_KEY MEDIA_OPERATOR_SESSION_SECRET; do
            if [ -z "${!name:-}" ]; then
              echo "Missing required production secret: $name"
              exit 1
            fi
          done
          if [ "${#MEDIA_OPERATOR_ACCESS_KEY}" -lt 24 ]; then
            echo "MEDIA_OPERATOR_ACCESS_KEY/MKETY_ADMIN_ACCESS_KEY must be at least 24 characters."
            exit 1
          fi
          if [ "${#MEDIA_OPERATOR_SESSION_SECRET}" -lt 32 ]; then
            echo "MEDIA_OPERATOR_SESSION_SECRET/MKETY_ADMIN_SESSION_SECRET must be at least 32 characters."
            exit 1
          fi

      - name: Install isolated dependencies
        run: npm install --no-audit --no-fund

      - name: Provision or reuse D1, KV and R2
        id: infra
        shell: bash
        run: |
          set -euo pipefail
          AUTH=(-H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json")

          curl --silent --show-error --fail-with-body             "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database?per_page=100"             "${AUTH[@]}" >/tmp/d1-list.json
          D1_ID=$(jq -r --arg n "$D1_NAME" '.result[]? | select(.name==$n) | (.uuid // .id)' /tmp/d1-list.json | head -n1)
          if [ -z "$D1_ID" ]; then
            jq -n --arg name "$D1_NAME" '{name:$name}' >/tmp/d1-create.json
            curl --silent --show-error --fail-with-body --request POST               "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database"               "${AUTH[@]}" --data @/tmp/d1-create.json >/tmp/d1-created.json
            D1_ID=$(jq -r '.result.uuid // .result.id' /tmp/d1-created.json)
          fi
          test -n "$D1_ID" && test "$D1_ID" != "null"

          curl --silent --show-error --fail-with-body             "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/storage/kv/namespaces?per_page=100"             "${AUTH[@]}" >/tmp/kv-list.json
          KV_ID=$(jq -r --arg n "$KV_TITLE" '.result[]? | select(.title==$n) | .id' /tmp/kv-list.json | head -n1)
          if [ -z "$KV_ID" ]; then
            jq -n --arg title "$KV_TITLE" '{title:$title}' >/tmp/kv-create.json
            curl --silent --show-error --fail-with-body --request POST               "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/storage/kv/namespaces"               "${AUTH[@]}" --data @/tmp/kv-create.json >/tmp/kv-created.json
            KV_ID=$(jq -r '.result.id' /tmp/kv-created.json)
          fi
          test -n "$KV_ID" && test "$KV_ID" != "null"

          R2_API="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/r2/buckets"
          status=$(curl --silent --show-error --output /tmp/r2.json --write-out '%{http_code}'             --request GET "$R2_API/$R2_BUCKET" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN")
          if [ "$status" = "404" ]; then
            jq -n --arg name "$R2_BUCKET" '{name:$name}' >/tmp/r2-create.json
            curl --silent --show-error --fail-with-body --request POST "$R2_API"               "${AUTH[@]}" --data @/tmp/r2-create.json >/tmp/r2.json
          elif [ "$status" != "200" ]; then
            cat /tmp/r2.json
            exit 1
          fi
          jq -e '.success == true' /tmp/r2.json >/dev/null

          echo "d1_id=$D1_ID" >> "$GITHUB_OUTPUT"
          echo "kv_id=$KV_ID" >> "$GITHUB_OUTPUT"
          echo "r2_bucket=$R2_BUCKET" >> "$GITHUB_OUTPUT"

      - name: Generate production Wrangler configs
        run: node scripts/prepare-production-config.mjs "${{ steps.infra.outputs.d1_id }}" "${{ steps.infra.outputs.kv_id }}" "${{ steps.infra.outputs.r2_bucket }}"

      - name: Validate TypeScript and production builds
        shell: bash
        run: |
          set -euo pipefail
          npx tsc --noEmit
          npm run build
          cp wrangler.jsonc wrangler.source.jsonc
          cp wrangler.production.jsonc wrangler.jsonc
          npm run cf:build
          npx wrangler deploy -c wrangler.production.jsonc --dry-run --outdir .generated/dry-portal
          npx wrangler deploy -c wrangler.delivery.production.jsonc --dry-run --outdir .generated/dry-assets
          npx wrangler deploy -c wrangler.maintenance.production.jsonc --dry-run --outdir .generated/dry-maintenance

      - name: Apply D1 schema
        run: npx wrangler d1 execute "$D1_NAME" --remote --file=schema.d1.sql --config wrangler.production.jsonc --yes

      - name: Deploy public assets Worker
        run: npx wrangler deploy -c wrangler.delivery.production.jsonc

      - name: Configure assets cache-purge secret
        shell: bash
        run: |
          set -euo pipefail
          PURGE_SECRET=$(printf '%s' "$MEDIA_OPERATOR_SESSION_SECRET|mkety-media-assets-purge" | sha256sum | cut -d' ' -f1)
          echo "::add-mask::$PURGE_SECRET"
          jq -n --arg value "$PURGE_SECRET" '{MEDIA_ASSET_PURGE_SECRET:$value}' >/tmp/media-assets-secrets.json
          npx wrangler secret bulk /tmp/media-assets-secrets.json --name "$ASSETS_WORKER"
          rm -f /tmp/media-assets-secrets.json

      - name: Deploy maintenance Worker
        run: npx wrangler deploy -c wrangler.maintenance.production.jsonc

      - name: Configure maintenance analytics credentials
        shell: bash
        run: |
          set -euo pipefail
          jq -n             --arg account "$CLOUDFLARE_ACCOUNT_ID"             --arg token "$CLOUDFLARE_API_TOKEN"             '{CLOUDFLARE_ACCOUNT_ID:$account,CLOUDFLARE_API_TOKEN:$token}' >/tmp/media-maintenance-secrets.json
          npx wrangler secret bulk /tmp/media-maintenance-secrets.json --name "$MAINTENANCE_WORKER"
          rm -f /tmp/media-maintenance-secrets.json

      - name: Deploy portal Worker
        run: npx wrangler deploy -c wrangler.production.jsonc

      - name: Configure portal runtime secrets
        shell: bash
        run: |
          set -euo pipefail
          TELEGRAM_WEBHOOK_SECRET=""
          TELEGRAM_BOT_USERNAME=""
          SAAS_ZONE_ID=""
          PURGE_SECRET=$(printf '%s' "$MEDIA_OPERATOR_SESSION_SECRET|mkety-media-assets-purge" | sha256sum | cut -d' ' -f1)
          echo "::add-mask::$PURGE_SECRET"

          curl --silent --show-error --fail-with-body \
            "https://api.cloudflare.com/client/v4/zones?name=mkety.app&account.id=$CLOUDFLARE_ACCOUNT_ID&per_page=5" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" >/tmp/media-saas-zone.json
          SAAS_ZONE_ID=$(jq -r '.result[0].id // empty' /tmp/media-saas-zone.json)

          if [ -n "${MEDIA_TELEGRAM_BOT_TOKEN:-}" ]; then
            TELEGRAM_WEBHOOK_SECRET=$(printf '%s' "$MEDIA_OPERATOR_SESSION_SECRET|mkety-media-telegram" | sha256sum | cut -d' ' -f1)
            echo "::add-mask::$TELEGRAM_WEBHOOK_SECRET"

            curl --silent --show-error --fail-with-body \
              "https://api.telegram.org/bot$MEDIA_TELEGRAM_BOT_TOKEN/getMe" \
              >/tmp/tg-getme.json
            jq -e '.ok == true' /tmp/tg-getme.json >/dev/null
            TELEGRAM_BOT_USERNAME=$(jq -r '.result.username // empty' /tmp/tg-getme.json)
            test -n "$TELEGRAM_BOT_USERNAME"

            curl --silent --show-error --fail-with-body \
              "https://api.telegram.org/bot$MEDIA_TELEGRAM_BOT_TOKEN/setMyCommands" \
              -H "Content-Type: application/json" \
              --data '{"commands":[{"command":"start","description":"Open Mkety Media support"},{"command":"pay","description":"Submit payment proof using an invoice reference"}]}' \
              >/tmp/tg-commands.json
            jq -e '.ok == true' /tmp/tg-commands.json >/dev/null

            curl --silent --show-error --fail-with-body \
              "https://api.telegram.org/bot$MEDIA_TELEGRAM_BOT_TOKEN/setMyDescription" \
              -H "Content-Type: application/json" \
              --data '{"description":"Mkety Media Support — customer help, Enterprise enquiries and secure payment-proof submission."}' \
              >/tmp/tg-description.json
            jq -e '.ok == true' /tmp/tg-description.json >/dev/null
          fi

          jq -n \
            --arg operatorKey "$MEDIA_OPERATOR_ACCESS_KEY" \
            --arg operatorSession "$MEDIA_OPERATOR_SESSION_SECRET" \
            --arg npApi "${NOWPAYMENTS_API_KEY:-}" \
            --arg npIpn "${NOWPAYMENTS_IPN_SECRET:-}" \
            --arg tgToken "${MEDIA_TELEGRAM_BOT_TOKEN:-}" \
            --arg tgChat "${MEDIA_TELEGRAM_CHAT_ID:-}" \
            --arg tgOps "${MEDIA_TELEGRAM_OPERATOR_IDS:-}" \
            --arg tgWebhook "$TELEGRAM_WEBHOOK_SECRET" \
            --arg tgUsername "$TELEGRAM_BOT_USERNAME" \
            --arg purgeSecret "$PURGE_SECRET" \
            --arg cfToken "$CLOUDFLARE_API_TOKEN" \
            --arg saasZone "$SAAS_ZONE_ID" \
            --arg saasTarget "media-fallback.mkety.app" \
            --arg assetsWorker "mkety-media-assets" \
            '{
              MEDIA_OPERATOR_ACCESS_KEY:$operatorKey,
              MEDIA_OPERATOR_SESSION_SECRET:$operatorSession,
              MEDIA_ASSET_PURGE_SECRET:$purgeSecret,
              MEDIA_CF_API_TOKEN:$cfToken,
              MEDIA_SAAS_CNAME_TARGET:$saasTarget,
              MEDIA_ASSETS_WORKER_NAME:$assetsWorker
            }
            + (if $saasZone=="" then {} else {MEDIA_SAAS_ZONE_ID:$saasZone} end)
            + (if ($npApi!="" and $npIpn!="") then {NOWPAYMENTS_API_KEY:$npApi,NOWPAYMENTS_IPN_SECRET:$npIpn} else {} end)
            + (if $tgToken=="" then {} else {MEDIA_TELEGRAM_BOT_TOKEN:$tgToken} end)
            + (if $tgChat=="" then {} else {MEDIA_TELEGRAM_CHAT_ID:$tgChat} end)
            + (if $tgOps=="" then {} else {MEDIA_TELEGRAM_OPERATOR_IDS:$tgOps} end)
            + (if $tgWebhook=="" then {} else {MEDIA_TELEGRAM_WEBHOOK_SECRET:$tgWebhook} end)
            + (if $tgUsername=="" then {} else {MEDIA_TELEGRAM_BOT_USERNAME:$tgUsername} end)' \
            >/tmp/media-portal-secrets.json

          npx wrangler secret bulk /tmp/media-portal-secrets.json --name "$PORTAL_WORKER"
          rm -f /tmp/media-portal-secrets.json

          if [ -n "${MEDIA_TELEGRAM_BOT_TOKEN:-}" ] && [ -n "$TELEGRAM_WEBHOOK_SECRET" ]; then
            TG_WEBHOOK_STATUS=$(curl --silent --show-error \
              --output /tmp/tg-webhook.json --write-out '%{http_code}' \
              "https://api.telegram.org/bot$MEDIA_TELEGRAM_BOT_TOKEN/setWebhook" \
              -H "Content-Type: application/json" \
              --data "$(jq -nc --arg url 'https://media.mkety.com/api/telegram/webhook' --arg secret "$TELEGRAM_WEBHOOK_SECRET" '{url:$url,secret_token:$secret,drop_pending_updates:false,allowed_updates:["message","callback_query"]}')")
            if [ "$TG_WEBHOOK_STATUS" != "200" ] || ! jq -e '.ok == true' /tmp/tg-webhook.json >/dev/null; then
              echo "Telegram setWebhook failed:"
              jq '{ok,description,error_code}' /tmp/tg-webhook.json
              exit 1
            fi

            TG_INFO_STATUS=$(curl --silent --show-error \
              --output /tmp/tg-webhook-info.json --write-out '%{http_code}' \
              "https://api.telegram.org/bot$MEDIA_TELEGRAM_BOT_TOKEN/getWebhookInfo")
            if [ "$TG_INFO_STATUS" != "200" ] || ! jq -e '.ok == true and .result.url == "https://media.mkety.com/api/telegram/webhook"' /tmp/tg-webhook-info.json >/dev/null; then
              echo "Telegram getWebhookInfo verification failed:"
              jq '{ok,description,error_code,result:{url:.result.url,last_error_message:.result.last_error_message,last_error_date:.result.last_error_date}}' /tmp/tg-webhook-info.json
              exit 1
            fi

            if [ -n "${MEDIA_TELEGRAM_CHAT_ID:-}" ]; then
              printf '%s' "$MEDIA_TELEGRAM_CHAT_ID" | grep -Eq '^-?[0-9]+$'
            fi
            if [ -n "${MEDIA_TELEGRAM_OPERATOR_IDS:-}" ]; then
              printf '%s' "$MEDIA_TELEGRAM_OPERATOR_IDS" | grep -Eq '^[0-9]+(,[0-9]+)*$'
            fi

            if [ -n "${MEDIA_TELEGRAM_CHAT_ID:-}" ]; then
              curl --silent --show-error \
                "https://api.telegram.org/bot$MEDIA_TELEGRAM_BOT_TOKEN/setMyCommands" \
                -H "Content-Type: application/json" \
                --data "$(jq -nc --arg chat "$MEDIA_TELEGRAM_CHAT_ID" '{scope:{type:"chat",chat_id:$chat},commands:[{command:"start",description:"Support menu"},{command:"pay",description:"Submit payment proof"},{command:"whoami",description:"Show operator ID"},{command:"bindgroup",description:"Bind this operator inbox"},{command:"groupid",description:"Show/bind operator group"}]}')" \
                >/tmp/tg-operator-commands.json || true
            fi

            if [ -n "${MEDIA_TELEGRAM_CHAT_ID:-}" ] && [ -n "${MEDIA_TELEGRAM_OPERATOR_IDS:-}" ]; then
              TG_GROUP_STATUS=$(curl --silent --show-error \
                --output /tmp/tg-operator-test.json --write-out '%{http_code}' \
                "https://api.telegram.org/bot$MEDIA_TELEGRAM_BOT_TOKEN/sendMessage" \
                -H "Content-Type: application/json" \
                --data "$(jq -nc --arg chat "$MEDIA_TELEGRAM_CHAT_ID" --arg username "$TELEGRAM_BOT_USERNAME" '{chat_id:$chat,text:("✅ Mkety Media bot connected\n\nBot: @"+$username+"\nWebhook: active\nOperator authorization: configured\n\nCustomers can now use support, Enterprise chat and payment-proof submission.")}')")
              if [ "$TG_GROUP_STATUS" != "200" ] || ! jq -e '.ok == true' /tmp/tg-operator-test.json >/dev/null; then
                echo "Telegram operator group is not reachable yet. The bot/webhook remain active."
                jq '{ok,description,error_code}' /tmp/tg-operator-test.json
                echo "Add the bot to the private operator group and send /bindgroup or /groupid from an authorized operator to bind it automatically."
              fi
            fi
          fi

      - name: Configure custom-domain fallback origin
        shell: bash
        run: |
          set -euo pipefail
          curl --silent --show-error --fail-with-body \
            "https://api.cloudflare.com/client/v4/zones?name=mkety.app&account.id=$CLOUDFLARE_ACCOUNT_ID&per_page=5" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" >/tmp/media-saas-zone.json
          SAAS_ZONE_ID=$(jq -r '.result[0].id // empty' /tmp/media-saas-zone.json)
          if [ -n "$SAAS_ZONE_ID" ]; then
            curl --silent --show-error --fail-with-body \
              "https://api.cloudflare.com/client/v4/zones/$SAAS_ZONE_ID/dns_records?type=AAAA&name=media-fallback.mkety.app&per_page=10" \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" >/tmp/media-fallback-dns.json
            FALLBACK_DNS_ID=$(jq -r '.result[0].id // empty' /tmp/media-fallback-dns.json)
            if [ -z "$FALLBACK_DNS_ID" ]; then
              curl --silent --show-error --fail-with-body --request POST \
                "https://api.cloudflare.com/client/v4/zones/$SAAS_ZONE_ID/dns_records" \
                -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json" \
                --data '{"type":"AAAA","name":"media-fallback.mkety.app","content":"100::","proxied":true,"ttl":1}' \
                >/tmp/media-fallback-created.json
            fi

            SAAS_FALLBACK_STATUS=$(curl --silent --show-error --output /tmp/saas-fallback.json --write-out '%{http_code}' \
              --request PUT "https://api.cloudflare.com/client/v4/zones/$SAAS_ZONE_ID/custom_hostnames/fallback_origin" \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json" \
              --data '{"origin":"media-fallback.mkety.app"}')
            if [ "$SAAS_FALLBACK_STATUS" != "200" ] || ! jq -e '.success == true' /tmp/saas-fallback.json >/dev/null 2>&1; then
              echo "Custom-domain fallback origin is not active yet; core Mkety Media remains available."
              jq '{success,errors,messages}' /tmp/saas-fallback.json 2>/dev/null || true
            fi
          fi

      - name: Smoke test production domains
        shell: bash
        run: |
          set -euo pipefail
          for url in \
            "https://media.mkety.com/" \
            "https://media.mkety.com/login" \
            "https://media.mkety.com/enterprise"; do
            curl --silent --show-error --fail --retry 8 --retry-delay 5 "$url" >/dev/null
          done
          status=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' "https://assets.mkety.app/not-a-tenant/not-a-bucket/not-a-file")
          test "$status" = "404"
          echo "Mkety Media production smoke checks passed."
