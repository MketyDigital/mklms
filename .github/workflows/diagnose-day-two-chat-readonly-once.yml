name: Diagnose Day Two chat timeline (read-only)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      DATABASE_URL: ${{ secrets.STARPIPS_DATABASE_URL }}
      DATABASE_SSL: ${{ secrets.STARPIPS_DATABASE_SSL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Read Day Two session and timeline state
        shell: bash
        run: |
          set -euo pipefail
          test -n "${DATABASE_URL:-}" || { echo "STARPIPS_DATABASE_URL is unavailable to this workflow"; exit 1; }
          npm install --no-save --package-lock=false --ignore-scripts --no-audit --no-fund pg@8.16.3
          node --input-type=module <<'NODE'
          import pg from "pg";
          const pool = new pg.Pool({
            connectionString: process.env.DATABASE_URL,
            ssl: process.env.DATABASE_SSL === "disable"
              ? false
              : process.env.DATABASE_SSL === "require"
                ? { rejectUnauthorized: false }
                : undefined,
            max: 1,
          });
          const client = await pool.connect();
          try {
            await client.query("BEGIN READ ONLY");
            const session = await client.query(
              `SELECT s.id, s.title, s.position, s.duration_seconds, s.media_asset_id,
                      s.status, s.updated_at, b.title AS batch_title
               FROM live_sessions s
               JOIN live_batches b ON b.id = s.batch_id
               WHERE s.id = $1`,
              ["1631fa52-40fa-48d1-93f1-b2820f18f3dc"],
            );
            const timeline = await client.query(
              `SELECT COUNT(*)::int AS count,
                      MIN(offset_seconds)::int AS first_offset_seconds,
                      MAX(offset_seconds)::int AS last_offset_seconds,
                      MIN(created_at) AS first_created_at,
                      MAX(created_at) AS last_created_at
               FROM live_timeline_messages
               WHERE session_id = $1`,
              ["1631fa52-40fa-48d1-93f1-b2820f18f3dc"],
            );
            const media = await client.query(
              `SELECT id, title, source_type, provider_asset_id, duration_seconds, processing_status, created_at, updated_at
               FROM media_assets
               WHERE id = $1`,
              ["945b59ec-ae4d-49b7-8af5-63348c1d1688"],
            );
            const clock = await client.query("SELECT NOW() AS checked_at");
            console.log(JSON.stringify({
              checkedAt: clock.rows[0]?.checked_at,
              session: session.rows[0] ?? null,
              timeline: timeline.rows[0] ?? null,
              media: media.rows[0] ?? null,
            }, null, 2));
            await client.query("ROLLBACK");
          } finally {
            client.release();
            await pool.end();
          }
          NODE
