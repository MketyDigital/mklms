name: Starpips migrate verified release once

on:
  push:
    branches:
      - ops/starpips-migrate-f25674f
    paths:
      - .github/workflows/starpips-migrate-release-once.yml

permissions:
  contents: read

jobs:
  migrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: database-migrations
    env:
      DATABASE_URL: ${{ secrets.MKLMS_DATABASE_URL }}
      DATABASE_SSL: ${{ secrets.MKLMS_DATABASE_SSL }}
    steps:
      - name: Checkout exact verified release
        uses: actions/checkout@v4
        with:
          ref: f25674f86cc15353776a0257e3cdc49d5c6c8653

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Verify Starpips migration secret
        shell: bash
        run: |
          set -euo pipefail
          test -n "${DATABASE_URL:-}" || { echo "Missing MKLMS_DATABASE_URL in database-migrations environment"; exit 1; }
          if [ -z "${DATABASE_SSL:-}" ]; then
            echo "DATABASE_SSL=require" >> "$GITHUB_ENV"
          fi

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Show pending migration status
        continue-on-error: true
        run: npm run db:status

      - name: Apply checksum-protected pending migrations
        run: npm run db:migrate

      - name: Verify Starpips database is current
        run: npm run db:status
